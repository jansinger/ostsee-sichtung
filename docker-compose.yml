name: ostseesichtung

services:
  db:
    image: postgis/postgis:18-3.6
    restart: always
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      # PostgreSQL 18+ uses version-specific path under /var/lib/postgresql
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
