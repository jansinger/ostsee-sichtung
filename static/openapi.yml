openapi: 3.0.3
info:
  title: Ostsee-Tiere API
  description: |
    API für die Meldung und Verwaltung von Meerestier-Sichtungen in der Ostsee.
    
    Diese API ermöglicht es Bürgern, Forschern und Naturbeobachtern, ihre Sichtungen von Walen, Robben und anderen Meerestieren zu melden und zu verwalten.
    
    ## Authentifizierung
    
    Für Admin-Funktionen ist eine Authentifizierung über Auth0 erforderlich. Die Authentifizierung erfolgt über Session-Cookies.
    
    ## Datenformate
    
    - Alle Datumsangaben sind im ISO 8601 Format (YYYY-MM-DD)
    - Koordinaten verwenden WGS84 (dezimale Grade)
    - Alle Antworten sind im JSON-Format
    
  version: 1.0.0
  contact:
    name: Ostsee-Tiere Team
    url: https://ostsee-tiere.de
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://localhost:4000
    description: Entwicklungsserver (HTTPS)
  - url: https://ostsee-tiere.de
    description: Produktionsserver

tags:
  - name: sightings
    description: Sichtungsmeldungen
  - name: legacy
    description: Legacy REST API für Mobile Apps
  - name: auth
    description: Authentifizierung
  - name: files
    description: Datei-Upload und -Verwaltung
  - name: geo
    description: Geografische Validierung
  - name: map
    description: Kartendaten
  - name: export
    description: Datenexport
  - name: media
    description: Sichere Medien-Bereitstellung
  - name: security
    description: Sicherheit und CSP Reports
  - name: config
    description: Konfigurationsverwaltung (Admin)
  - name: admin
    description: Admin-spezifische Operationen
  - name: health
    description: Systemgesundheit und Monitoring
  - name: statistics
    description: Statistiken und Metriken

paths:
  /api/sightings:
    get:
      tags:
        - sightings
      summary: Sichtungen abrufen
      description: |
        Ruft öffentlich verfügbare Sichtungen für ein bestimmtes Jahr ab.
        Standardmäßig werden nur genehmigte Sichtungen zurückgegeben.
      parameters:
        - name: year
          in: query
          description: Jahr der Sichtungen
          required: false
          schema:
            type: integer
            minimum: 2000
            maximum: 2030
            default: 2024
            example: 2024
      responses:
        '200':
          description: Liste der Sichtungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicSighting'
              example:
                - id: 1840
                  ts: 1672531200
                  dt: "01.01.2024"
                  ti: "14:30"
                  lat: 54.3233
                  lon: 13.0814
                  ct: 3
                  yo: 1
                  ta: 1
                  tf: 0
                  na: "Max Mustermann"
                  ar: "Greifswalder Bodden"
                  sh: "MS Baltic"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags:
        - sightings
      summary: Neue Sichtung melden
      description: Erstellt eine neue Sichtungsmeldung
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SightingFormData'
      responses:
        '201':
          description: Sichtung erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SightingResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          description: Datenbank-Integritätsfehler (z.B. doppelter Eintrag)
          content:
            application/json:
              schema:
                type: object
                required: [success, code, message]
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    enum: [DATABASE_ERROR]
                  message:
                    type: string
                  detail:
                    type: string
                    description: Nur in Development-Umgebung
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/{id}:
    get:
      tags:
        - sightings
      summary: Einzelne Sichtung abrufen
      description: Ruft Details einer bestimmten Sichtung ab (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
      responses:
        '200':
          description: Sichtungsdetails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedSighting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      tags:
        - sightings
      summary: Sichtung aktualisieren
      description: Aktualisiert eine bestehende Sichtung (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SightingFormData'
      responses:
        '200':
          description: Sichtung erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedSighting'
        '400':
          $ref: '#/components/responses/ValidationError'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - sightings
      summary: Sichtung löschen
      description: Löscht eine Sichtung (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
      responses:
        '200':
          description: Sichtung erfolgreich gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/{id}/verify:
    patch:
      tags:
        - sightings
      summary: Sichtung prüfen und freigeben
      description: |
        Setzt den Prüfstatus einer Sichtung (Admin-Berechtigung erforderlich).

        Eine Sichtung kennt genau zwei Zustände: ungeprüft und geprüft.
        Geprüft bedeutet zugleich veröffentlicht — einen dritten Zustand
        "geprüft, aber nicht freigegeben" gibt es nicht. Der Endpunkt schreibt
        deshalb immer beide Datenbankspalten gemeinsam: `verified` und
        `approvedAt`.
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verified
              properties:
                verified:
                  type: integer
                  enum: [0, 1]
                  description: 1 für geprüft und freigegeben, 0 für ungeprüft und zurückgezogen
                  example: 1
      responses:
        '200':
          description: Prüfstatus erfolgreich aktualisiert
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - id
                  - verified
                  - approvedAt
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  id:
                    type: integer
                    example: 1840
                  verified:
                    type: integer
                    enum: [0, 1]
                    example: 1
                  approvedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Zeitpunkt der Freigabe; null wenn ungeprüft
                    example: "2026-07-28T09:12:44.000Z"
                  message:
                    type: string
                    example: "Sichtung wurde geprüft und freigegeben"
        '400':
          $ref: '#/components/responses/BadRequest'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - sightings
      summary: Prüfstatus abrufen
      description: Gibt den aktuellen Prüf- und Freigabestatus einer Sichtung zurück (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID der Sichtung
          schema:
            type: integer
            minimum: 1
            example: 1840
      responses:
        '200':
          description: Aktueller Prüf- und Freigabestatus
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - verified
                  - approvedAt
                properties:
                  id:
                    type: integer
                    example: 1840
                  verified:
                    type: integer
                    enum: [0, 1]
                    example: 1
                  approvedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Zeitpunkt der Freigabe; null wenn ungeprüft
                    example: "2026-07-28T09:12:44.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/export:
    get:
      tags:
        - export
      summary: Sichtungen exportieren
      description: Exportiert Sichtungen in verschiedenen Formaten (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: format
          in: query
          description: Exportformat
          required: true
          schema:
            type: string
            enum: [json, csv, xml, kml]
            example: json
        - name: fromDate
          in: query
          description: Startdatum (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: toDate
          in: query
          description: Enddatum (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2024-12-31"
        - name: verified
          in: query
          description: Nur verifizierte Sichtungen
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Exportdatei
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            application/vnd.google-earth.kml+xml:
              schema:
                type: string
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/sightings/export/json:
    get:
      tags:
        - export
      summary: JSON-Export
      description: Exportiert Sichtungen im JSON-Format (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/ExportDateFrom'
        - $ref: '#/components/parameters/ExportDateTo'
        - $ref: '#/components/parameters/ExportVerified'
        - $ref: '#/components/parameters/ExportEntryChannel'
        - $ref: '#/components/parameters/ExportMediaUpload'
      responses:
        '200':
          description: JSON-Datei mit Sichtungen
          content:
            application/json:
              schema:
                type: object
                required: [metadata, sichtungen]
                properties:
                  metadata:
                    type: object
                    required: [exportDate, recordCount, filters]
                    properties:
                      exportDate:
                        type: string
                        format: date-time
                      recordCount:
                        type: integer
                      filters:
                        type: object
                        properties:
                          dateFrom:
                            type: string
                            nullable: true
                          dateTo:
                            type: string
                            nullable: true
                          verified:
                            type: string
                            nullable: true
                          entryChannel:
                            type: string
                            nullable: true
                          mediaUpload:
                            type: string
                            nullable: true
                  sichtungen:
                    type: array
                    items:
                      $ref: '#/components/schemas/DetailedSighting'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Interner Serverfehler beim JSON-Export
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /api/sightings/export/csv:
    get:
      tags:
        - export
      summary: CSV-Export
      description: Exportiert Sichtungen im CSV-Format (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/ExportDateFrom'
        - $ref: '#/components/parameters/ExportDateTo'
        - $ref: '#/components/parameters/ExportVerified'
        - $ref: '#/components/parameters/ExportEntryChannel'
        - $ref: '#/components/parameters/ExportMediaUpload'
      responses:
        '200':
          description: CSV-Datei mit Sichtungen
          content:
            text/csv:
              schema:
                type: string
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Interner Serverfehler beim CSV-Export
          content:
            text/plain:
              schema:
                type: string

  /api/sightings/export/xml:
    get:
      tags:
        - export
      summary: XML-Export
      description: Exportiert Sichtungen im XML-Format (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/ExportDateFrom'
        - $ref: '#/components/parameters/ExportDateTo'
        - $ref: '#/components/parameters/ExportVerified'
        - $ref: '#/components/parameters/ExportEntryChannel'
        - $ref: '#/components/parameters/ExportMediaUpload'
      responses:
        '200':
          description: XML-Datei mit Sichtungen
          content:
            application/xml:
              schema:
                type: string
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Interner Serverfehler beim XML-Export
          content:
            application/xml:
              schema:
                type: string

  /api/sightings/export/kml:
    get:
      tags:
        - export
      summary: KML-Export
      description: Exportiert Sichtungen im KML-Format für Google Earth (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - $ref: '#/components/parameters/ExportDateFrom'
        - $ref: '#/components/parameters/ExportDateTo'
        - $ref: '#/components/parameters/ExportVerified'
        - $ref: '#/components/parameters/ExportEntryChannel'
        - $ref: '#/components/parameters/ExportMediaUpload'
      responses:
        '200':
          description: KML-Datei mit Sichtungen
          content:
            application/vnd.google-earth.kml+xml:
              schema:
                type: string
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Interner Serverfehler beim KML-Export
          content:
            application/xml:
              schema:
                type: string

  /api/sightings/ref/{refId}:
    get:
      tags:
        - sightings
      summary: Sichtung nach Referenz-ID abrufen
      description: Ruft eine Sichtung anhand ihrer Referenz-ID ab (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: refId
          in: path
          required: true
          description: Referenz-ID der Sichtung
          schema:
            type: string
            example: "abc123def456"
      responses:
        '200':
          description: Sichtungsdetails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedSighting'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Sichtung nicht gefunden
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: "Sighting not found"
        '500':
          description: Interner Serverfehler
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: "Internal server error"

  /api/statistics:
    get:
      tags:
        - statistics
      summary: Sichtungsstatistiken abrufen
      description: |
        Gibt aggregierte Statistiken über **freigegebene** Sichtungen zurück
        (`freigegeben_am IS NOT NULL`) — dieselbe Grundmenge wie die öffentliche
        Karte unter `/sichtungen/showreports.json`. Nicht freigegebene Meldungen
        zählen nicht mit.

        Ergebnis wird für 1 Stunde gecacht.
      responses:
        '200':
          description: Statistiken
          headers:
            Cache-Control:
              description: Cache-Einstellungen
              schema:
                type: string
                example: "public, max-age=3600"
            X-Cache-Status:
              description: Kennzeichnet den Cache-Status der Antwort
              schema:
                type: string
                example: "HIT"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
        '500':
          description: Fallback-Statistiken bei internem Fehler
          headers:
            Cache-Control:
              description: Kürzeres Caching bei Fehlern
              schema:
                type: string
                example: "public, max-age=300"
            X-Cache-Status:
              description: Kennzeichnet Fallback-Daten
              schema:
                type: string
                example: "ERROR"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'

  /api/maintenance-status:
    get:
      tags:
        - admin
      summary: Wartungsmodus-Status abrufen
      description: Gibt den aktuellen Status des Wartungsmodus zurück (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      responses:
        '200':
          description: Wartungsmodus-Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceStatus'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/config:
    get:
      tags:
        - config
      summary: Konfiguration abrufen
      description: Gibt Konfigurationseinträge zurück, optional gefiltert nach Kategorie (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: category
          in: query
          description: Kategorie filtern
          schema:
            type: string
            example: "display"
      responses:
        '200':
          description: Liste der Konfigurationseinträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigEntry'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - config
      summary: Konfigurationseintrag aktualisieren
      description: Aktualisiert oder erstellt einen Konfigurationseintrag (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - value
                - category
              properties:
                key:
                  type: string
                  description: Konfigurationsschlüssel
                  example: "display.maxSightings"
                value:
                  description: Konfigurationswert (beliebiger JSON-Wert)
                  example: 100
                description:
                  type: string
                  description: Beschreibung des Eintrags
                  example: "Maximale Anzahl Sichtungen auf Startseite"
                category:
                  type: string
                  description: Kategorie des Eintrags
                  example: "display"
      responses:
        '200':
          description: Konfiguration aktualisiert
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - config
      summary: Konfigurationseintrag löschen
      description: Löscht einen Konfigurationseintrag (Admin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      parameters:
        - name: key
          in: query
          required: true
          description: Konfigurationsschlüssel
          schema:
            type: string
            example: "display.maxSightings"
      responses:
        '200':
          description: Konfiguration gelöscht
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/config/public:
    get:
      tags:
        - config
      summary: Öffentliche Konfiguration abrufen
      description: Gibt öffentlich sichtbare Konfigurationswerte zurück (kein Auth erforderlich)
      responses:
        '200':
          description: Öffentliche Konfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/config/upload:
    get:
      tags:
        - config
      summary: Upload-Konfiguration abrufen
      description: Gibt Upload-Konfiguration zurück (max. Dateigröße, erlaubte Dateitypen)
      responses:
        '200':
          description: Upload-Konfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadConfig'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/config/init:
    post:
      tags:
        - config
      summary: Standardkonfiguration initialisieren
      description: Initialisiert die Standardkonfiguration (Superadmin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      responses:
        '200':
          description: Konfiguration initialisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/config/reset:
    post:
      tags:
        - config
      summary: Konfiguration zurücksetzen
      description: Setzt alle Konfigurationseinträge auf Standardwerte zurück (Superadmin-Berechtigung erforderlich)
      security:
        - adminAuth: []
      responses:
        '200':
          description: Konfiguration zurückgesetzt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '302':
          $ref: '#/components/responses/LoginRedirect'
        '403':
