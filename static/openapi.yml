    LegacySightingResponse:
      type: object
      title: Legacy Sichtungsantwort
      description: |
        Sichtungsdaten im Legacy-Format für showreports.json Endpunkt.
        Feldnamen entsprechen exakt der PDF-Spezifikation.
      required:
        - id
        - datum
        - uhrzeit
        - anzahlGesamt
        - anzahlJung
        - tierart
        - totfund
      properties:
        id:
          type: integer
          description: Eindeutige Sichtungs-ID
          example: 1840
        datum:
          type: string
          description: 'Sichtungsdatum im Format DD.MM.YYYY'
          pattern: '^\d{2}\.\d{2}\.\d{4}$'
          example: "01.01.2024"
        uhrzeit:
          type: string
          description: 'Sichtungszeit im Format HH:MM'
          pattern: '^\d{2}:\d{2}$'
          example: "14:30"
        breitengrad:
          type: number
          format: float
          description: Breitengrad (nur wenn verfügbar)
          example: 54.3233
        laengengrad:
          type: number
          format: float
          description: Längengrad (nur wenn verfügbar)
          example: 13.0814
        anzahlGesamt:
          type: integer
          description: Gesamtanzahl der Tiere
          minimum: 0
          example: 3
        anzahlJung:
          type: integer
          description: Anzahl der Jungtiere
          minimum: 0
          example: 1
        tierart:
          type: integer
          description: Tierart-ID
          minimum: 0
          example: 0
        totfund:
          type: integer
          description: 'Totfund-Flag (0=nein, 1=ja)'
          enum: [0, 1]
          example: 0
        beobachterName:
          type: string
          description: 'Name des Beobachters (nur bei Einverständnis)'
          example: "Max Mustermann"
        gebiet:
          type: string
          description: Gebiet/Gewässer
          example: "Greifswalder Bodden"
        schiffsname:
          type: string
          description: 'Schiffsname (nur bei Einverständnis)'
          example: "MS Baltic"