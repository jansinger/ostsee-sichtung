  /health:
    get:
      tags:
        - health
      summary: Health Check
      description: Gibt den aktuellen Systemstatus zurück. Wird von Docker und Load Balancer genutzt.
      responses:
        '200':
          description: System ist gesund
          headers:
            Cache-Control:
              description: Kein Caching
              schema:
                type: string
                example: "no-cache, no-store, must-revalidate"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System ist ungesund (z.B. Datenbankverbindung fehlt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
    head:
      tags:
        - health
      summary: Health Check (HEAD)
      description: Schneller Health Check ohne Response Body
      responses:
        '200':
          description: System ist gesund

  /api/media/{path}:
    get:
      tags:
        - media
      summary: Sichere Medien-Bereitstellung
      description: |
        Stellt Mediendateien mit Zugriffskontrolle bereit.
        
        **Zugriffskontrolle:**
        - Öffentlicher Zugriff für genehmigte Sichtungen
        - Admin-Zugriff für nicht genehmigte Sichtungen
        - 404 für nicht existierende oder nicht autorisierte Dateien
      parameters:
        - name: path
          in: path
          required: true
          description: Dateipfad der Mediendatei
          schema:
            type: string
            example: "sichtung-123/photo-abc123.jpg"
      responses:
        '200':
          description: Mediendatei erfolgreich bereitgestellt
          headers:
            Content-Type:
              description: MIME-Type der Datei
              schema:
                type: string
                example: "image/jpeg"
            Content-Length:
              description: Dateigröße in Bytes
              schema:
                type: integer
                example: 1024000
            Content-Disposition:
              description: Wie die Datei angezeigt werden soll
              schema:
                type: string
                example: 'inline; filename="photo.jpg"'
            Cache-Control:
              description: Cache-Einstellungen
              schema:
                type: string
                example: "public, max-age=31536000, immutable"
            ETag:
              description: Entity Tag für Caching
              schema:
                type: string
                example: '"abc123def456"'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Not Modified (Cache-Hit)
        '404':
          description: Datei nicht gefunden oder nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "File not found"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
