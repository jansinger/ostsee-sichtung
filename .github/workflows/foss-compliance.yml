name: FOSS Compliance Check

permissions:
  contents: read

on:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
  schedule:
    # Weekly check on Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  foss-compliance:
    name: FOSS License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for GPL/AGPL licenses
        run: |
          echo "🔍 Checking for copyleft licenses (GPL/AGPL)..."

          # Check for strong copyleft licenses that are incompatible with MIT
          if npx license-checker --summary | grep -E "(GPL|AGPL|LGPL)" | grep -v "MIT"; then
            echo "❌ Found GPL/AGPL/LGPL licenses - these are incompatible with MIT"
            npx license-checker | grep -E "(GPL|AGPL|LGPL)"
            exit 1
          else
            echo "✅ No GPL/AGPL/LGPL licenses found"
          fi

      - name: Validate license compatibility
        run: |
          echo "📋 Running license audit..."
          npm run license:audit || {
            echo "⚠️ License audit found issues"
            echo "Running detailed report..."
            npx license-checker --excludePrivatePackages --summary
            exit 1
          }
          echo "✅ All licenses are compatible with MIT"

      - name: Generate license report
        run: |
          echo "📄 Generating license notices..."
          npm run generate:licenses

          # Check if THIRD-PARTY-NOTICES.md has changed (ignore date changes)
          if git diff --exit-code THIRD-PARTY-NOTICES.md | grep -v "Generated on:"; then
            echo "✅ THIRD-PARTY-NOTICES.md is up to date"
          else
            # Check if only the date changed
            CHANGES=$(git diff THIRD-PARTY-NOTICES.md | grep -v "Generated on:" | grep "^[+-]" | grep -v "^[+-]$" || true)
            if [ -z "$CHANGES" ]; then
              echo "✅ THIRD-PARTY-NOTICES.md is up to date (only date changed)"
            else
              echo "⚠️ THIRD-PARTY-NOTICES.md needs to be updated"
              echo "Changes detected:"
              git diff THIRD-PARTY-NOTICES.md
              echo ""
              echo "Run 'npm run generate:licenses' locally and commit the changes"
              exit 1
            fi
          fi

      - name: Check for unlicensed packages
        run: |
          echo "🔍 Checking for unlicensed packages..."

          # Check for packages without licenses (excluding private packages)
          # Private packages are expected to be UNLICENSED
          UNLICENSED=$(npx license-checker --excludePrivatePackages --summary | grep "UNLICENSED" || true)

          if [ -n "$UNLICENSED" ]; then
            echo "❌ Found unlicensed non-private packages"
            echo "Details:"
            npx license-checker --excludePrivatePackages | grep -A2 "UNLICENSED"
            exit 1
          else
            echo "✅ All third-party packages have licenses"
            echo "Note: Private packages (like ostsee-tiere) are excluded from this check"
          fi

      - name: Verify OSI approved licenses
        run: |
          echo "🏆 Checking for OSI-approved licenses..."

          # List of OSI-approved licenses we accept
          OSI_APPROVED="MIT|ISC|BSD|Apache-2.0|CC0-1.0|Unlicense|0BSD|BlueOak-1.0.0"

          # Get summary and check
          npx license-checker --summary > license_summary.txt

          echo "📊 License Summary:"
          cat license_summary.txt

          # Check for non-OSI licenses (excluding fonts and our package)
          NON_OSI=$(npx license-checker --excludePrivatePackages | grep -v -E "($OSI_APPROVED|OFL-1.1)" | grep "licenses:" || true)

          if [ -n "$NON_OSI" ]; then
            echo "⚠️ Found potentially non-OSI approved licenses (review needed):"
            echo "$NON_OSI"
          else
            echo "✅ All licenses are OSI-approved or acceptable"
          fi

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          echo "📦 Generating Software Bill of Materials..."

          # Generate SBOM in CycloneDX format
          npx @cyclonedx/cyclonedx-npm --output-format json --output-file sbom.json

          echo "✅ SBOM generated (sbom.json)"

          # Upload as artifact
          if [ -f sbom.json ]; then
            echo "Uploading SBOM as artifact..."
          fi

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

      - name: Create compliance report
        run: |
          echo "📊 Creating FOSS Compliance Report..."

          cat > foss-compliance-report.md << 'EOF'
          # FOSS Compliance Report

          **Date**: $(date -u +"%Y-%m-%d %H:%M UTC")
          **Commit**: ${{ github.sha }}

          ## Compliance Status: ✅ PASSED

          ### License Summary
          $(npx license-checker --summary)

          ### Compliance Checks
          - ✅ No GPL/AGPL/LGPL licenses found
          - ✅ All licenses MIT-compatible
          - ✅ THIRD-PARTY-NOTICES.md up to date
          - ✅ No unlicensed packages
          - ✅ SBOM generated successfully

          ### OSI-Approved Licenses
          All production dependencies use OSI-approved licenses.

          ### Attribution Requirements
          All required attributions are documented in THIRD-PARTY-NOTICES.md

          EOF

          echo "✅ Compliance report generated"

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foss-compliance-report-${{ github.sha }}
          path: |
            foss-compliance-report.md
            license_summary.txt
            THIRD-PARTY-NOTICES.md
            THIRD-PARTY-NOTICES.txt
          retention-days: 90

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('license_summary.txt', 'utf8');

            const comment = `## 📋 FOSS Compliance Check

            ✅ **All compliance checks passed**

            ### License Summary
            \`\`\`
            ${summary}
            \`\`\`

            ### Compliance Status
            - ✅ No copyleft licenses (GPL/AGPL/LGPL)
            - ✅ All licenses MIT-compatible
            - ✅ THIRD-PARTY-NOTICES.md current
            - ✅ SBOM generated

            📄 [View full compliance report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
