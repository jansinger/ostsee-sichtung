name: Docker Publish

on:
  # Triggered by release-please after release creation
  repository_dispatch:
    types: [release-created]
  # Manual trigger with version input
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.31.6)'
        required: true
  # Also trigger on tags for backwards compatibility
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ostsee-sichtung

permissions: {}

jobs:
  prepare:
    name: Prepare Build
    runs-on: ubuntu-latest
    permissions: {}

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.client_payload.sha }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Log build info
        run: |
          echo "Building Docker image for version: ${{ steps.version.outputs.version }}"
          echo "Using commit SHA: ${{ steps.version.outputs.sha }}"

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ needs.prepare.outputs.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "Digest: $digest"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create Multi-Platform Manifest
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.inspect.outputs.digest }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Remove 'v' prefix for semver tags
          SEMVER="${VERSION#v}"
          MAJOR="${SEMVER%%.*}"
          MINOR="${SEMVER%.*}"

          echo "Creating manifest for version: $VERSION"
          echo "Tags: $VERSION, $SEMVER, $MINOR, $MAJOR, latest"

          # Create all tags
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${VERSION} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${SEMVER} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${MINOR} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${MAJOR} \
            -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        id: inspect
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${VERSION}
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${VERSION} --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Image digest: $DIGEST"

      - name: Generate image digest file
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "Image Digest: ${{ steps.inspect.outputs.digest }}" > image-digest.txt
          echo "Version: ${VERSION}" >> image-digest.txt
          echo "Platforms: linux/amd64, linux/arm64" >> image-digest.txt
          echo "" >> image-digest.txt
          echo "Pull Command:" >> image-digest.txt
          echo "docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${VERSION}" >> image-digest.txt

      - name: Upload image digest as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-digest
          path: image-digest.txt
          retention-days: 90

  create-release-assets:
    name: Create Release Assets
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    if: startsWith(needs.prepare.outputs.version, 'v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download image digest
        uses: actions/download-artifact@v8
        with:
          name: docker-image-digest

      - name: Create deployment package
        run: |
          mkdir -p release-assets

          # Copy Docker Compose files
          cp docker-compose.production.yml release-assets/

          # Copy environment template
          cp .env.example release-assets/.env.example

          # Copy monitoring configuration
          cp -r monitoring release-assets/ 2>/dev/null || true

          # Copy deployment documentation
          cp docs/DOCKER_DEPLOYMENT.md release-assets/ 2>/dev/null || true
          cp docs/ENVIRONMENT.md release-assets/ 2>/dev/null || true

          # Copy image digest
          cp image-digest.txt release-assets/

          # Create README for the package
          cat > release-assets/README.md << 'EOF'
          # Ostsee-Tiere Docker Deployment Package

          This package contains everything you need to deploy Ostsee-Tiere using Docker.

          ## Quick Start

          1. Configure your environment:
             ```bash
             cp .env.example .env
             nano .env  # Edit with your settings
             ```

          2. Start the services:
             ```bash
             docker compose -f docker-compose.production.yml up -d
             ```

          3. Access the application at http://localhost:3000

          ## Documentation

          - See `DOCKER_DEPLOYMENT.md` for detailed deployment instructions
          - See `ENVIRONMENT.md` for environment variable reference
          - See `image-digest.txt` for Docker image information

          ## Support

          For issues and questions, visit:
          https://github.com/jansinger/ostsee-sichtung/issues
          EOF

          # Create tarball
          VERSION="${{ needs.prepare.outputs.version }}"
          tar -czf ostsee-tiere-docker-${VERSION}.tar.gz -C release-assets .

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: |
            ostsee-tiere-docker-${{ needs.prepare.outputs.version }}.tar.gz
            release-assets/docker-compose.production.yml
            release-assets/.env.example
            release-assets/image-digest.txt
          fail_on_unmatched_files: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [prepare, merge]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (JSON)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.json
          retention-days: 90
