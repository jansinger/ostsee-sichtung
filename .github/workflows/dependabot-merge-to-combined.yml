name: Merge Dependabot to Combined Branch

on:
  workflow_run:
    workflows: ["Dependabot PR Testing"]
    types: [completed]
    branches-ignore:
      - 'dependabot-combined'
  workflow_dispatch:

jobs:
  merge-to-combined:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get successful Dependabot PR
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            // Get the PR that triggered this workflow
            const workflowRun = context.payload.workflow_run;

            if (!workflowRun) {
              console.log('No workflow run found, exiting');
              return { shouldContinue: false };
            }

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: workflowRun.head_branch
            });

            const dependabotPR = prs.find(pr =>
              pr.user.login === 'dependabot[bot]' &&
              pr.head.ref === workflowRun.head_branch
            );

            if (!dependabotPR) {
              console.log('No Dependabot PR found for this workflow run');
              return { shouldContinue: false };
            }

            console.log(`Found Dependabot PR #${dependabotPR.number}: ${dependabotPR.title}`);

            core.setOutput('pr-number', dependabotPR.number);
            core.setOutput('pr-title', dependabotPR.title);
            core.setOutput('pr-branch', dependabotPR.head.ref);
            core.setOutput('should-continue', 'true');

            return {
              shouldContinue: true,
              prNumber: dependabotPR.number,
              prTitle: dependabotPR.title,
              prBranch: dependabotPR.head.ref
            };

      - name: Exit if no PR found
        if: steps.get-pr.outputs.should-continue != 'true'
        run: |
          echo "No Dependabot PR to process. Exiting."
          exit 0

      - name: Ensure combined branch exists
        if: steps.get-pr.outputs.should-continue == 'true'
        run: |
          # Check if combined branch exists
          if git ls-remote --heads origin dependabot-combined | grep -q dependabot-combined; then
            echo "Combined branch exists, checking it out"
            git fetch origin dependabot-combined
            git checkout dependabot-combined
            git pull origin dependabot-combined
          else
            echo "Creating new combined branch from main"
            git checkout -b dependabot-combined
            git push origin dependabot-combined
          fi

      - name: Merge Dependabot PR into combined branch
        if: steps.get-pr.outputs.should-continue == 'true'
        run: |
          # Fetch the Dependabot branch
          git fetch origin ${{ steps.get-pr.outputs.pr-branch }}

          # Merge with no-ff to preserve PR history
          git merge origin/${{ steps.get-pr.outputs.pr-branch }} --no-ff --no-edit -m "merge: ${{ steps.get-pr.outputs.pr-title }}"

          # Push to combined branch
          git push origin dependabot-combined

      - name: Setup Node.js
        if: steps.get-pr.outputs.should-continue == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and run tests
        if: steps.get-pr.outputs.should-continue == 'true'
        run: |
          npm ci
          npm run check
          npm run lint
          npm run type-check
          npm run test

      - name: Get all merged Dependabot PRs
        if: steps.get-pr.outputs.should-continue == 'true'
        id: get-all-prs
        uses: actions/github-script@v7
        with:
          script: |
            // Get all open Dependabot PRs
            const { data: allPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const dependabotPRs = allPRs.filter(pr =>
              pr.user.login === 'dependabot[bot]' &&
              pr.head.ref.startsWith('dependabot/')
            );

            // Get commits from combined branch
            const { data: commits } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: 'dependabot-combined'
            });

            // Find which PRs are already merged into combined branch
            const mergedPRs = [];
            for (const pr of dependabotPRs) {
              const prCommits = commits.commits.filter(c =>
                c.commit.message.includes(pr.title)
              );

              if (prCommits.length > 0) {
                mergedPRs.push({
                  number: pr.number,
                  title: pr.title,
                  branch: pr.head.ref,
                  url: pr.html_url
                });
              }
            }

            console.log(`Found ${mergedPRs.length} Dependabot PRs in combined branch`);

            core.setOutput('merged-prs', JSON.stringify(mergedPRs));
            core.setOutput('count', mergedPRs.length);

            return { mergedPRs, count: mergedPRs.length };

      - name: Generate PR content
        if: steps.get-pr.outputs.should-continue == 'true'
        id: pr-content
        uses: actions/github-script@v7
        with:
          script: |
            const mergedPRs = JSON.parse('${{ steps.get-all-prs.outputs.merged-prs }}');

            // Group updates by type
            const updates = {
              major: [],
              minor: [],
              patch: [],
              other: []
            };

            let hasMajor = false;

            mergedPRs.forEach(pr => {
              const title = pr.title;
              const match = title.match(/bump (.+) from (.+) to (.+)/i);

              if (match) {
                const [, packageName, fromVersion, toVersion] = match;
                const versionType = getVersionType(fromVersion, toVersion);

                if (versionType === 'major') hasMajor = true;

                updates[versionType].push({
                  packageName,
                  fromVersion,
                  toVersion,
                  prNumber: pr.number,
                  url: pr.url
                });
              } else {
                updates.other.push({
                  title: title,
                  prNumber: pr.number,
                  url: pr.url
                });
              }
            });

            function getVersionType(from, to) {
              const fromParts = from.split('.').map(Number);
              const toParts = to.split('.').map(Number);

              if (toParts[0] > fromParts[0]) return 'major';
              if (toParts[1] > fromParts[1]) return 'minor';
              if (toParts[2] > fromParts[2]) return 'patch';
              return 'other';
            }

            // Create conventional commit title
            let commitType = 'chore';
            let scope = 'deps';

            if (hasMajor) {
              commitType = 'build';
            }

            const count = mergedPRs.length;
            let subject = `update ${count} ${count === 1 ? 'dependency' : 'dependencies'}`;

            const title = `${commitType}(${scope}): ${subject}${hasMajor ? ' ⚠️' : ''}`;

            // Create PR body
            let body = '## 🤖 Combined Dependabot Updates\n\n';
            body += `This PR combines ${count} Dependabot update${count === 1 ? '' : 's'} into a single PR.\n\n`;

            if (hasMajor) {
              body += '> ⚠️ **Warning:** This PR contains major version updates that may include breaking changes.\n\n';
            }

            // Major Updates
            if (updates.major.length > 0) {
              body += '### ⚠️ Major Updates\n\n';
              updates.major.forEach(u => {
                body += `- **${u.packageName}**: ${u.fromVersion} → ${u.toVersion} ([#${u.prNumber}](${u.url}))\n`;
              });
              body += '\n';
            }

            // Minor Updates
            if (updates.minor.length > 0) {
              body += '### ✨ Minor Updates\n\n';
              updates.minor.forEach(u => {
                body += `- **${u.packageName}**: ${u.fromVersion} → ${u.toVersion} ([#${u.prNumber}](${u.url}))\n`;
              });
              body += '\n';
            }

            // Patch Updates
            if (updates.patch.length > 0) {
              body += '### 🐛 Patch Updates\n\n';
              updates.patch.forEach(u => {
                body += `- **${u.packageName}**: ${u.fromVersion} → ${u.toVersion} ([#${u.prNumber}](${u.url}))\n`;
              });
              body += '\n';
            }

            // Other Updates
            if (updates.other.length > 0) {
              body += '### 📦 Other Updates\n\n';
              updates.other.forEach(u => {
                body += `- ${u.title} ([#${u.prNumber}](${u.url}))\n`;
              });
              body += '\n';
            }

            body += '---\n\n';
            body += '**✅ All tests have passed on the combined branch.**\n\n';
            body += 'After merging this PR, all individual Dependabot PRs will be automatically closed.\n';

            core.setOutput('title', title);
            core.setOutput('body', body);
            core.setOutput('has-major', hasMajor);

            return { title, body, hasMajor };

      - name: Check for existing combined PR
        if: steps.get-pr.outputs.should-continue == 'true'
        id: check-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:dependabot-combined`,
              base: 'main'
            });

            if (prs.length > 0) {
              console.log(`Found existing PR #${prs[0].number}`);
              core.setOutput('exists', 'true');
              core.setOutput('pr-number', prs[0].number);
              return { exists: true, prNumber: prs[0].number };
            } else {
              console.log('No existing PR found');
              core.setOutput('exists', 'false');
              return { exists: false };
            }

      - name: Create or update combined PR
        if: steps.get-pr.outputs.should-continue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '${{ steps.pr-content.outputs.title }}';
            const body = `${{ steps.pr-content.outputs.body }}`;
            const exists = '${{ steps.check-pr.outputs.exists }}' === 'true';
            const hasMajor = '${{ steps.pr-content.outputs.has-major }}' === 'true';

            let labels = ['dependencies', 'automated'];
            if (hasMajor) {
              labels.push('breaking-change');
            }

            if (exists) {
              // Update existing PR
              const prNumber = parseInt('${{ steps.check-pr.outputs.pr-number }}');

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                title: title,
                body: body
              });

              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: labels
              });

              console.log(`Updated PR #${prNumber}`);
            } else {
              // Create new PR
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                head: 'dependabot-combined',
                base: 'main',
                body: body
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labels
              });

              console.log(`Created new PR #${pr.number}: ${pr.html_url}`);
            }

      - name: Comment on Dependabot PR
        if: steps.get-pr.outputs.should-continue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.get-pr.outputs.pr-number }}');
            const combinedPrNumber = '${{ steps.check-pr.outputs.pr-number }}';

            let message = '✅ **Tests passed!** This update has been merged into the combined Dependabot PR.\n\n';

            if (combinedPrNumber) {
              message += `➡️ See combined PR: #${combinedPrNumber}\n\n`;
            }

            message += 'This PR will remain open until the combined PR is merged to main, then it will be automatically closed.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: message
            });
