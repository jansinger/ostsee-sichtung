name: CI

on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast change detection — determines which jobs to run
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    outputs:
      needs-e2e: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.dependencies == 'true' || steps.filter.outputs.e2e == 'true' || github.event_name == 'push' }}
      has-code-changes: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true' }}
      needs-migration-check: ${{ steps.filter.outputs.db-schema == 'true' || steps.filter.outputs.db-migrations == 'true' }}

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'static/**'
              - 'app.html'
              - '*.config.js'
              - '*.config.ts'
              - 'package.json'
            backend:
              - 'src/routes/api/**'
              - 'src/lib/server/**'
            # Die Tests selbst sind Code. Ohne diesen Filter fiel ein PR, der nur
            # unter `e2e/` änderte, in den Doc-Only-Fall: `needs-e2e` blieb false,
            # und `E2E Tests` wie `Component Tests` wurden übersprungen. Genau so
            # liefen #636 und #641 durch — beide verschärften die Scan-Regel in
            # `e2e/helpers/bannedClasses.ts`, aber nur deren Unit-Test lief (über
            # `Validate` → `npm run test:unit`, das `e2e/helpers/*.test.ts`
            # einsammelt, siehe vitest.config.ts). Der DOM-Scan in
            # `e2e/design-tokens.spec.ts` — der Teil, der die Reichweite der Regel
            # gegen die echten Routen prüft — lief nie.
            #
            # `scripts/seed-e2e.ts` gehört dazu, weil der E2E-Job es als
            # „Seed E2E test data" ausführt; sonst wäre eine kaputte Seed-Datei
            # ungetestet gemergt. `playwright.config.ts` und `vite.config.ci.ts`
            # stehen hier der Klarheit halber, obwohl `frontend` sie über
            # `*.config.ts` heute schon einfängt — dieser Filter soll die
            # E2E-Eingaben vollständig benennen, nicht auf einen Zufallstreffer
            # bauen.
            #
            # `.github/workflows/ci.yml` gehört aus demselben Grund dazu: Der
            # `e2e`-Job trägt die Shard-Aufteilung selbst, und eine Änderung
            # daran ist eine Änderung an den E2E-Eingaben. Ohne diesen Eintrag
            # überspringt ein PR, der nur die Shards umbaut, ausgerechnet den
            # Job, den er umbaut — die Zuordnung eines Specs wäre dann erst nach
            # dem Merge auf `main` das erste Mal gelaufen.
            e2e:
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'vite.config.ci.ts'
              - 'scripts/seed-e2e.ts'
              - '.github/workflows/ci.yml'
            docs:
              - '*.md'
              - 'docs/**'
              - '.github/**/*.md'
            dependencies:
              - 'package-lock.json'
              - 'package.json'
            db-schema:
              - 'src/lib/server/db/schema.ts'
              - 'drizzle.config.ts'
            db-migrations:
              - 'drizzle/**'

  # Lint, type-check, unit tests, build — runs in parallel with E2E
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup environment
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Ensure Svelte Kit is in sync
        run: npx svelte-kit sync

      # Commit message validation (skip for release-please and dependabot)
      - name: Validate commit messages
        if: |
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'release-please') &&
          github.actor != 'dependabot[bot]'
        run: |
          echo "Validating commit messages..."
          npx commitlint --from=origin/main --to=HEAD --verbose

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run Svelte check
        run: npm run check

      - name: Run unit tests (server)
        if: needs.changes.outputs.has-code-changes != 'true'
        run: npm run test:unit

      - name: Run unit tests (server) with coverage
        if: needs.changes.outputs.has-code-changes == 'true'
        run: npm run test:unit -- --coverage

      - name: Upload coverage reports
        if: needs.changes.outputs.has-code-changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 30

      - name: Build application
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # Schema changes must ship with a generated migration — deployed environments
  # apply ONLY committed migrations on container start (scripts/docker-migrate.ts),
  # so a schema.ts change without a drizzle/ migration would never reach production.
  # Rule: .claude/rules/database.md
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.changes.outputs.needs-migration-check == 'true'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require migration files for schema changes
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          SCHEMA_FILES=$(echo "$CHANGED" | grep -xE 'src/lib/server/db/schema\.ts|drizzle\.config\.ts' || true)

          if [ -n "$SCHEMA_FILES" ]; then
            if ! echo "$CHANGED" | grep -qE '^drizzle/.*\.sql$|^drizzle/meta/_journal\.json$'; then
              while IFS= read -r f; do
                echo "::error file=$f::$f geändert, aber keine Migration committet."
              done <<< "$SCHEMA_FILES"
              echo ""
              echo "❌ Folgende Datei(en) wurden geändert, aber der PR enthält keine"
              echo "   neue Migrationsdatei unter drizzle/:"
              echo "$SCHEMA_FILES" | sed 's/^/   - /'
              echo ""
              echo "Deployments wenden ausschließlich generierte Migrationen an"
              echo "(scripts/docker-migrate.ts beim Container-Start) — ohne Migration"
              echo "kommt diese Schema-Änderung in Produktion nie an."
              echo ""
              echo "Fix: npm run db:generate ausführen und die neuen Dateien unter"
              echo "     drizzle/ mit committen. Regel: .claude/rules/database.md"
              exit 1
            fi
          fi
          echo "✅ Schema- und Migrationsänderungen sind konsistent committet."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # drizzle-kit generate is offline (works from drizzle/meta snapshots); the
      # URL is only needed because drizzle.config.ts refuses to load without it.
      - name: Verify schema and migrations are in sync (drizzle-kit generate)
        env:
          DATABASE_POSTGRES_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npx drizzle-kit generate --name ci_sync_check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Schema und Migrationen sind nicht synchron."
            echo ""
            echo "❌ drizzle-kit generate hat aus dem committeten Schema noch"
            echo "   Änderungen erzeugt — die committeten Migrationen decken das"
            echo "   Schema nicht vollständig ab:"
            echo ""
            git status --porcelain drizzle/
            echo ""
            echo "Fix: npm run db:generate lokal ausführen und die neuen Dateien"
            echo "     unter drizzle/ mit committen. Regel: .claude/rules/database.md"
            exit 1
          fi
          echo "✅ Migrationen decken das Schema vollständig ab."
  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'push' || github.event.pull_request.draft == false) &&
      !startsWith(github.head_ref || '', 'release-please') &&
      needs.changes.outputs.needs-e2e == 'true'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup environment
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Run SvelteKit sync
        run: npx svelte-kit sync

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-node24-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run component tests (client/browser)
        run: npm run test:unit:client

  # E2E tests — runs in parallel with validate and component tests, skipped for doc-only changes
  e2e:
    name: E2E Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'push' || github.event.pull_request.draft == false) &&
      !startsWith(github.head_ref || '', 'release-please') &&
      needs.changes.outputs.needs-e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: form
          - shard: map
          - shard: smoke

    permissions:
      contents: read

    # Eine Quelle für die Verbindung: Die Migrations- und Seed-Skripte lesen sie
    # aus `process.env`, der von Playwright gestartete Dev-Server über
    # `$env/dynamic/private` aus der `.env` (siehe src/lib/server/db/index.ts).
    # Der „Setup environment"-Schritt unten schreibt denselben Wert dorthin —
    # beide Seiten müssen hier übereinstimmen, sonst migriert der Job eine andere
    # Datenbank als die, welche die Seiten lesen.
    env:
      DATABASE_POSTGRES_URL: postgresql://ci:ci@localhost:5432/ostsee_ci

    # PostGIS, nicht plain Postgres: `sichtungen.location` ist eine
    # geometry(point)-Spalte (drizzle/0000_initial.sql), die Migration scheitert
    # ohne die Extension. Dasselbe Image wie in docker-compose.yml — das
    # postgis/postgis-Image aktiviert die Extension beim initdb selbst in
    # POSTGRES_DB, ein eigenes `CREATE EXTENSION` ist deshalb nicht nötig.
    #
    # Warum überhaupt: Ohne Datenbank übersprang der Scan in
    # design-tokens.spec.ts ausgerechnet /admin und /admin/statistics — die zwei
    # datenreichsten Seiten, auf denen Datentabelle, Statusbadges, stat-value und
    # Paginierung sitzen. Nebeneffekt der alten Lage: rund 50 s Wartezeit im
    # smoke-Shard, weil die DB-Verbindungen in Timeouts liefen.
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ostsee_ci
        ports:
          - 5432:5432
        # `-h 127.0.0.1` erzwingt TCP und ist kein Detail: Der Entrypoint des
        # Postgres-Images startet während `initdb` einen temporären Server, der
        # NUR auf dem Unix-Socket lauscht — dort laufen dann die Init-Skripte,
        # inklusive dem, das PostGIS anlegt. Ein `pg_isready` über den Socket
        # meldet in diesem Fenster „bereit", während die Datenbank noch nicht
        # existiert. Lokal nachgestellt: `pg_isready` sagte 4 s vor der Datenbank
        # „accepting connections". Über TCP gibt es das Fenster nicht.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d ostsee_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # `.env` liest der Dev-Server (über Vite) und liest der Testprozess
      # (e2e/helpers/adminSession.ts ruft dotenv auf, für DATABASE_POSTGRES_URL und
      # COOKIE_NAME). Die Fixture schreibt seit dem Session-Store eine Zeile in
      # `sessions`, statt ein Token zu signieren — der E2E-Job hat dafür einen
      # PostGIS-Service und führt die Migrationen aus.
      #
      # Die Zuweisungen unten sind mit `sed` gesetzt und nicht angehängt, damit
      # die Datei jede Variable genau einmal enthält: Bei zwei Zeilen mit
      # demselben Namen entscheidet die Reihenfolge, und das wäre ein stiller
      # Unterschied zwischen dotenv und Vite.
      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i "s|^DATABASE_POSTGRES_URL=.*|DATABASE_POSTGRES_URL=\"${DATABASE_POSTGRES_URL}\"|" .env
          # SKIP_DB_CHECK aus .env.example gilt hier nicht mehr: Es gibt jetzt eine
          # Datenbank. Bleibt der Skip an, fällt ein Ausfall des Postgres-Service
          # nicht als 503 auf, sondern erst irgendwo im Seiten-Load — und die
          # Lücke, die dieser Job schließt, wäre wieder offen.
          sed -i 's|^SKIP_DB_CHECK=.*|SKIP_DB_CHECK="false"|' .env
          grep -cE '^DATABASE_POSTGRES_URL=' .env | grep -qx 1
          grep -E '^(DATABASE_POSTGRES_URL|SKIP_DB_CHECK)=' .env

      - name: Install dependencies
        run: npm ci

      - name: Run SvelteKit sync
        run: npx svelte-kit sync

      # Zweiter Wächter neben dem Health-Check: Er stellt sicher, dass PostGIS
      # wirklich installiert ist. `sichtungen.location` ist geometry(point) — ohne
      # die Extension scheitert die erste Migration mit „type geometry does not
      # exist", und das ist eine Meldung, die man ohne diesen Schritt drei
      # Ebenen tiefer sucht.
      #
      # Über das `postgres`-Paket aus node_modules und nicht über `psql`: Ein
      # `psql` auf dem Runner-Image ist eine Zusage der Image-Zusammenstellung,
      # das Paket ist eine Zusage der package-lock.json.
      - name: Verify PostGIS is ready
        run: |
          node --input-type=module -e '
            const { default: postgres } = await import("postgres");
            const ATTEMPTS = 30;
            for (let attempt = 1; attempt <= ATTEMPTS; attempt++) {
              const sql = postgres(process.env.DATABASE_POSTGRES_URL, { max: 1, connect_timeout: 5 });
              try {
                const [row] = await sql`SELECT postgis_version() AS version`;
                if (!row) throw new Error("SELECT postgis_version() lieferte keine Zeile");
                console.log(`PostGIS bereit: ${row.version}`);
                await sql.end();
                process.exit(0);
              } catch (error) {
                await sql.end({ timeout: 1 }).catch(() => {});
                if (attempt === ATTEMPTS) {
                  // Erst auf Objekt prüfen, dann Felder lesen: `throw null` ist
                  // erlaubtes JS, und ein catch-Block, der beim Formulieren der
                  // Meldung selbst wirft, verdeckt genau die Ursache, die er
                  // melden soll. `code` bleibt als Rückfall, weil ein
                  // ECONNREFUSED aus `postgres` hier nachweislich mit leerer
                  // `message` ankam.
                  const fields = error && typeof error === "object" ? error : {};
                  const reason = fields.message || fields.code || String(error);
                  console.error(`::error::PostGIS ist nach ${ATTEMPTS} Versuchen nicht erreichbar: ${reason}`);
                  process.exit(1);
                }
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
            }
          '

      # Ausschließlich die committeten Migrationen — kein `drizzle-kit push`.
      # Begründung in scripts/docker-migrate.ts; hier zählt zusätzlich, dass CI
      # damit denselben Weg fährt wie der Produktions-Container.
      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed E2E test data
        run: npm run db:seed:e2e

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-node24-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Die Specs stehen einzeln da, weil die drei Shards parallel laufen und
      # ähnlich lang brauchen sollen — ein Verzeichnis je Shard gäbe das nicht
      # her. Der Preis war bisher, dass ein neu angelegter Spec in keiner Liste
      # stand und damit **nirgends** lief. Genau so konnte #749 einen roten
      # Wächter auf `main` hinterlassen, ohne dass eine Prüfung anschlug; beim
      # Aufräumen fielen 14 weitere Specs auf, die nie in CI gelaufen sind.
      # Der Vollständigkeits-Abgleich unten macht aus „vergessen" einen
      # Fehlschlag — die Aufzählung bleibt, ihr stiller Ausfall nicht.
      - name: Run E2E tests
        run: |
          set -euo pipefail
          shopt -s nullglob

          form=(
            e2e/form-submit.spec.ts
            e2e/form-ux.spec.ts
            e2e/form-a11y.spec.ts
            e2e/form-autosave.spec.ts
            # Thematisch bei den beiden anderen Admin-Specs in `map` — steht
            # hier nach derselben Regel, die die dort begründet: Nach #769 misst
            # `form` 152 s und ist damit der kürzeste Shard, `map` mit 169 s der
            # längste. Der Spec wiegt lokal 9 s; er gehört an den kurzen Shard.
            # Der Aufschlag für die kalt kompilierte /admin-Route ist dabei
            # eingeplant (Begründung weiter unten bei `smoke`).
            e2e/admin-detail-actions.spec.ts
            # Aus demselben Grund hier und nicht bei den Admin-Specs in `map`:
            # `form` ist der kürzeste Shard, und die /admin-Route wird durch den
            # Spec darüber ohnehin schon kalt kompiliert — der Aufschlag fällt
            # hier also kein zweites Mal an. Lokal 13 s für zwei Tests.
            e2e/admin-table-dead-finding.spec.ts
          )

          # Die drei Shards laufen parallel; die Laufzeit des Jobs ist die des
          # längsten. Ab hier folgt die Zuordnung deshalb der gemessenen Dauer
          # und erst danach dem Thema — `map` trägt sichtbar Specs, die mit der
          # Karte nichts zu tun haben. app-shell-height fährt immerhin die
          # MapPage mit, der Rest ist Admin- und Formular-Verhalten. Alle Shards
          # bekommen denselben Unterbau (PostGIS-Service, Migrationen, Seed),
          # DB-Specs sind hier also genauso zu Hause wie anderswo.
          map=(
            e2e/map-*.spec.ts
            e2e/horizontal-overflow.spec.ts
            e2e/admin-edit-preserves-record.spec.ts
            e2e/admin-table-verified-column.spec.ts
            e2e/app-shell-height.spec.ts
            e2e/submit-offline.spec.ts
            e2e/meldung-wording.spec.ts
            # Trotz `form`-Präfix hier: teilt sich mit dem Schwester-Spec
            # map-pan-zoom.spec.ts das Messwerkzeug (e2e/helpers/mapCanvas.ts).
            # Fällt nicht unter das Glob und steht deshalb einzeln.
            e2e/form-map-pan-zoom.spec.ts
            # Ebenfalls trotz `form`-Präfix hier, aber aus dem Laufzeit-Grund
            # oben und nicht wegen geteilten Werkzeugs: Beide prüfen die Karte
            # im Meldeformular — ein Tippen setzt die Koordinaten, ein Foto mit
            # EXIF-GPS setzt Position, Datum und Uhrzeit, und die
            # Bereichsprüfung schlägt außerhalb der Ostsee an. Das ist dieselbe
            # Komponente, die die map-*-Specs fahren.
            e2e/form-position.spec.ts
            e2e/form-position-photo.spec.ts
          )

          # design-tokens.spec.ts gehört hierher, nicht zu form: es prüft das
          # Theme, nicht das Formular. Läuft gegen /styleguide, das der
          # dev-Guard nur im Entwicklungsmodus freigibt — der Shard startet
          # ohnehin `vite dev` (playwright.config.ts).
          #
          # modal-overflow.spec.ts aus demselben Grund: Es prüft Layout über
          # /, /bestimmungshilfe und /admin, nicht das Formular.
          smoke=(
            e2e/basic.test.ts
            e2e/homepage.test.ts
            e2e/about-page.spec.ts
            e2e/auth.spec.ts
            e2e/design-tokens.spec.ts
            e2e/modal-overflow.spec.ts
            e2e/bestimmungshilfe.spec.ts
            e2e/navbar-structure.spec.ts
            e2e/seo-meta.spec.ts
            e2e/footer-layout.spec.ts
            # Die beiden Stepper-Specs stünden thematisch bei `form`. Sie liegen
            # hier, weil `form` der längste Shard ist und sie zusammen 44 s
            # wiegen.
            e2e/form-stepper.spec.ts
            e2e/form-stepper-affordance.spec.ts
            e2e/videoUpload.spec.ts
            # Aus demselben Laufzeit-Grund, und thematisch bei modal-overflow
            # zu Hause: Der Spec prüft den ortsfesten Balken gegen Viewport und
            # scroll-padding — Layout, nicht Formularlogik.
            e2e/form-field-mode.spec.ts
            # Die folgenden drei kamen mit der Einstiegsseite („Was möchten Sie
            # melden?") dazu. Sie stünden thematisch bei `form` und liegen hier,
            # weil `form` zum Zeitpunkt ihrer Zuordnung der längste Shard war.
            #
            # ACHTUNG: Diese Begründung ist seit #769 überholt — dort wurde nach
            # echten CI-Schrittdauern neu verteilt, und `form` ist seither der
            # kürzeste Shard. Neu gemessen wurde nach dem Merge noch nicht.
            # Wer das nächste Mal ausbalanciert, prüft diese drei zuerst: Sie
            # gehören thematisch zu `form` und dürften nach der aktuellen Regel
            # („Zuordnung folgt der gemessenen Dauer und erst danach dem Thema")
            # ohnehin dorthin. Lokal wiegen sie zusammen rund 45 s — lokale
            # Zahlen sind aber genau die, vor denen der Block weiter unten
            # warnt; maßgeblich ist die Schrittdauer aus GitHub Actions.
            e2e/report-kind-choice.spec.ts
            # Zweite Ausblende-Achse: `sightingFrom` auf Schritt 2, nicht die
            # Einstiegsseite. Der schwerste der drei.
            e2e/form-from-land.spec.ts
            # `mediaConsent` auf Schritt 4, nur bei vorhandener Aufnahme.
            e2e/media-consent-placement.spec.ts
          )

          # Der Rückstand von 14 Specs ist abgearbeitet: 13 davon liefen am
          # 2026-08-05 lokal dreimal hintereinander durch (82 Tests je Lauf,
          # kein Fehlschlag, kein Flake) und stehen jetzt in `map` bzw. `smoke`.
          #
          # Verteilt wurde nach gemessener Dauer, nicht nach Thema. `form` hat
          # dabei bewusst nichts abbekommen; der Shard war schon der längste,
          # und die Job-Laufzeit ist die des längsten.
          #
          # **Womit gemessen wird.** Maßgeblich ist die Schrittdauer „Run E2E
          # tests" aus GitHub Actions selbst:
          #
          #   gh api "repos/jansinger/ostsee-tiere/actions/runs/<id>/jobs" --jq \
          #     '.jobs[] | select(.name|startswith("E2E Tests")) | [.name,
          #      ((.steps[]|select(.name=="Run E2E tests")
          #        |(((.completed_at|fromdate)-(.started_at|fromdate))|tostring)))]|@tsv'
          #
          # **Nicht** die Summe der `result.duration` aus `--reporter=json`, mit
          # der die Aufteilung bis hierher gerechnet wurde. Playwright rechnet
          # `beforeAll` keinem Test zu, und fast alle map-Specs bauen ihre Seite
          # genau dort auf (`test.describe.serial` + geteilte Page, siehe
          # map-accessibility.spec.ts: 0,4 s für 18 Tests). Die Summe lässt
          # `map` dadurch um ein Vielfaches zu billig aussehen. Gemessen an den
          # echten Schrittdauern stand hier nicht 190/153/152, sondern nach #766
          # form 205 s, smoke 128 s, map 122 s — und E2E Tests (form) war mit
          # 258 s die Wanduhr des **gesamten** Workflows, nächstlängster Job
          # 171 s.
          #
          # Ein einziger lokaler Lauf über alle Shards misst die Shards übrigens
          # nicht: In CI ist jeder Shard ein eigener Job mit kaltem
          # `node_modules/.vite`, lokal ist der Dep-Cache warm — die erste Datei
          # trägt sonst die Kaltstartkosten aller anderen. Pro Shard mit eigenem,
          # frisch gestartetem Dev-Server messen; lokale Wanduhr × Shard-Faktor
          # (gemessen: form 1,35 · map 1,29 · smoke 1,37) trifft die
          # CI-Schrittdauer eines **unveränderten** Shards gut.
          #
          # Was dieser Faktor **nicht** kann: die Kosten eines verschobenen Specs
          # vorhersagen. Die Verschiebung hier war auf 157/158/155 geschätzt und
          # kam bei 152/169/161 heraus — `form` fast genau, beide aufnehmenden
          # Shards rund 10 s darüber. Der Grund ist derselbe wie oben: Der
          # aufnehmende Shard zahlt die Vite-Kaltkompilierung der Routen, die er
          # vorher nicht gefahren ist, noch einmal. Wer verschiebt, plant den
          # Aufschlag ein und prüft danach an der echten Schrittdauer nach.
          #
          # Wer hier etwas hinzufügt oder verschiebt, misst vorher — so.
          #
          # Der Rückstand ist damit vollständig abgearbeitet: form-map-pan-zoom
          # .spec.ts, der letzte verbliebene Eintrag, steht seit dem 2026-08-05
          # in `map`.
          #
          # Der Befund („in 3 von 4 Baseline-Läufen rot") stimmte, die Diagnose
          # war ungenau: Verglichen wurde nicht **nach** der Geste — die
          # Canvas-Fingerprints dort hängen an `expect.poll` und sind robust —,
          # sondern **davor**, in einer Vorprüfung `box.y >= 0` auf der Oberkante
          # des Karten-Containers. `scrollIntoViewIfNeeded` zentriert die Karte,
          # und der Sub-Pixel-Rest daraus macht `box.y` minimal negativ, sobald
          # die 400px hohe Karte die Fensterhöhe ausfüllt. Reproduziert bei
          # 1280×400: `box.y = -0.40625`, Vorprüfung rot, während die Geste bei
          # `y = 311.6` mitten im Bild lag und die Karte einwandfrei schob. Die
          # Vorprüfung fragt jetzt per `elementFromPoint`, ob die Geste die Karte
          # trifft — dieselbe Frage ohne Fließkomma-Rand. 10 aufeinanderfolgende
          # Läufe grün, dazu 4 von 4 bei 1280×400.
          #
          # Die Liste bleibt als leeres Array stehen, damit der Abgleich unten
          # unverändert über vier Listen läuft. Sie ist **kein Parkplatz**: Ein
          # neuer Spec gehört in einen Shard, und was hier landet, läuft nirgends.
          unassigned=()

          # Die Soll-Liste kommt von Playwright selbst, nicht von einem `find`,
          # das dessen Auswahlregel nachbaut. Der Nachbau war in beide
          # Richtungen falsch: Er kannte nur `.ts/.tsx/.js/.jsx`, während der
          # Default-`testMatch` auch `.mts/.cts/.mjs/.cjs` einsammelt — eine
          # `foo.spec.mts` hätte den Abgleich bestanden und wäre trotzdem in
          # keinem Shard gelaufen, also genau der stille Ausfall, gegen den er
          # gebaut wurde. Umgekehrt gilt `testIgnore: ['**/helpers/**']` auf
          # jeder Ebene, `-not -path 'e2e/helpers/*'` nur auf der obersten; eine
          # Datei unter `e2e/pages/helpers/` hätte CI rot gemacht und eine
          # Zuordnung verlangt, die Playwright nie ausführt.
          #
          # `--list` braucht weder Dev-Server noch Datenbank (kein `webServer`,
          # kein `globalSetup`) und läuft in rund zwei Sekunden. Der Bericht geht
          # über `PLAYWRIGHT_JSON_OUTPUT_NAME` in eine Datei statt über stdout:
          # dort steht eine dotenv-Präambel davor, an der jedes JSON.parse
          # scheitert. `suite.file` ist relativ zu `config.rootDir` — und das ist
          # das testDir (`e2e/`), nicht das Repo-Wurzelverzeichnis.
          #
          # Ein Unterprozess statt eines `**`-Musters hält außerdem die Zusage aus
          # #761 ein: Das Skript bleibt mit `bash -n` prüfbar, weil weder
          # `globstar` noch `extglob` nötig sind.
          playwright_report=$(mktemp)
          trap 'rm -f "$playwright_report"' EXIT
          PLAYWRIGHT_JSON_OUTPUT_NAME="$playwright_report" \
            npx playwright test --list --reporter=json > /dev/null

          collect='
            const { readFileSync } = require("node:fs");
            const { relative, resolve } = require("node:path");
            const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
            for (const suite of report.suites) {
              console.log(relative(process.cwd(), resolve(report.config.rootDir, suite.file)));
            }
          '
          mapfile -t collected < <(node -e "$collect" "$playwright_report" | sort -u)

          # Ohne diese Schranke ginge eine leere Auswahl — umbenanntes testDir,
          # kaputte Config — als „alles zugeordnet" durch.
          if [ ${#collected[@]} -eq 0 ]; then
            echo "::error::Playwright hat keine Specs gemeldet; der Abgleich wäre wertlos."
            exit 1
          fi

          known=" ${form[*]} ${map[*]} ${smoke[*]} ${unassigned[*]} "
          selected=" ${collected[*]} "

          # Ein Spec, der in keiner der vier Listen steht, ist neu und beim
          # Anlegen vergessen worden.
          missing=()
          for spec in "${collected[@]}"; do
            case "$known" in
              *" $spec "*) ;;
              *) missing+=("$spec") ;;
            esac
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Diese Specs stehen in keinem Shard und würden nirgends laufen: ${missing[*]}"
            echo "Bitte in .github/workflows/ci.yml einem Shard (form/map/smoke) zuordnen."
            exit 1
          fi

          # Die Gegenrichtung: Ein Eintrag, den Playwright nicht auswählt — weil
          # die Datei umbenannt wurde oder der Pfad sich vertippt hat — läuft
          # stillschweigend nicht. Playwright bricht nur ab, wenn **kein**
          # Argument trifft; ein einzelner toter Eintrag neben lebenden fällt
          # sonst nirgends auf.
          dead=()
          for spec in "${form[@]}" "${map[@]}" "${smoke[@]}" "${unassigned[@]}"; do
            case "$selected" in
              *" $spec "*) ;;
              *) dead+=("$spec") ;;
            esac
          done
          if [ ${#dead[@]} -gt 0 ]; then
            echo "::error::Diese Einträge wählt Playwright nicht aus und liefen damit nie: ${dead[*]}"
            echo "Bitte in .github/workflows/ci.yml korrigieren oder entfernen."
            exit 1
          fi

          case "${{ matrix.shard }}" in
            form) specs=("${form[@]}") ;;
            map) specs=("${map[@]}") ;;
            smoke) specs=("${smoke[@]}") ;;
            *)
              echo "Unknown shard: ${{ matrix.shard }}"
              exit 1
              ;;
          esac

          # Ohne diese Schranke wäre ein leer gelaufenes Glob (nullglob) ein
          # `npm run test:e2e --` ohne Argumente — und das startet die gesamte
          # Suite statt des Shards.
          if [ ${#specs[@]} -eq 0 ]; then
            echo "::error::Shard ${{ matrix.shard }} hat keine Specs ermittelt."
            exit 1
          fi

          npm run test:e2e -- "${specs[@]}"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  # Compliance checks for dependency updates
  compliance:
    name: Compliance Check
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.labels.*.name, 'dependencies') ||
        startsWith(github.head_ref, 'dependabot/')
      )

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for copyleft licenses
        run: |
          echo "Checking for copyleft licenses (GPL/AGPL)..."

          # license-checker has a bug with Node 24 where it crashes on some packages
          # We use error suppression and validate what we can
          LICENSE_OUTPUT=$(npx license-checker --summary 2>&1 || echo "LICENSE_CHECK_FAILED")

          if echo "$LICENSE_OUTPUT" | grep -q "LICENSE_CHECK_FAILED"; then
            echo "⚠️ License checker encountered an error (known Node 24 compatibility issue)"
            echo "Falling back to package.json license validation..."

            # Basic check: ensure our package and key deps have valid licenses
            if grep -q '"license": "MIT"' package.json; then
              echo "✅ Project license is MIT"
            else
              echo "❌ Project license is not MIT"
              exit 1
            fi
          elif echo "$LICENSE_OUTPUT" | grep -E "(GPL|AGPL)" | grep -v "MIT"; then
            echo "Found GPL/AGPL/LGPL licenses - these may be incompatible"
            npx license-checker 2>/dev/null | grep -E "(GPL|AGPL)" || true
            exit 1
          else
            echo "✅ No copyleft licenses found"
          fi

      - name: Validate license compatibility
        run: |
          echo "Running license audit..."

          # license-checker has known issues with Node 24
          # We attempt the check but don't fail on tool errors
          npm run license:audit 2>&1 || {
            EXIT_CODE=$?
            # Check if it's a tool crash vs actual license issue
            if npm run license:audit 2>&1 | grep -q "TypeError"; then
              echo "⚠️ License checker tool error (Node 24 compatibility issue)"
              echo "Skipping detailed license audit - SBOM will still be generated"
            else
              echo "License audit found issues"
              npm run license:check 2>&1 || true
              exit 1
            fi
          }
          echo "License check completed"

      - name: Generate SBOM
        run: |
          echo "Generating Software Bill of Materials..."
          mkdir -p sbom
          npm run sbom:prod || true

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90
