name: CI

on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast change detection — determines which jobs to run
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    outputs:
      needs-e2e: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.dependencies == 'true' || github.event_name == 'push' }}
      has-code-changes: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true' }}

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'static/**'
              - 'app.html'
              - '*.config.js'
              - '*.config.ts'
              - 'package.json'
            backend:
              - 'src/routes/api/**'
              - 'src/lib/server/**'
            docs:
              - '*.md'
              - 'docs/**'
              - '.github/**/*.md'
            dependencies:
              - 'package-lock.json'
              - 'package.json'

  # Lint, type-check, unit tests, build — runs in parallel with E2E
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup environment
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Ensure Svelte Kit is in sync
        run: npx svelte-kit sync

      - name: Install Playwright for component tests
        run: npx playwright install --with-deps chromium

      # Commit message validation (skip for release-please and dependabot)
      - name: Validate commit messages
        if: |
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'release-please') &&
          github.actor != 'dependabot[bot]'
        run: |
          echo "Validating commit messages..."
          npx commitlint --from=origin/main --to=HEAD --verbose

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run Svelte check
        run: npm run check

      - name: Run unit tests (server)
        if: needs.changes.outputs.has-code-changes != 'true'
        run: npm run test:unit

      - name: Run unit tests (server) with coverage
        if: needs.changes.outputs.has-code-changes == 'true'
        run: npm run test:unit -- --coverage

      - name: Run component tests (client/browser)
        run: npm run test:unit:client

      - name: Upload coverage reports
        if: needs.changes.outputs.has-code-changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 30

      - name: Build application
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # E2E tests — runs in parallel with validate, skipped for doc-only changes
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'push' || github.event.pull_request.draft == false) &&
      !startsWith(github.head_ref || '', 'release-please') &&
      needs.changes.outputs.needs-e2e == 'true'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup environment
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Run SvelteKit sync
        run: npx svelte-kit sync

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-node24-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  # Compliance checks for dependency updates
  compliance:
    name: Compliance Check
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      (
        contains(github.event.pull_request.labels.*.name, 'dependencies') ||
        startsWith(github.head_ref, 'dependabot/')
      )

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for copyleft licenses
        run: |
          echo "Checking for copyleft licenses (GPL/AGPL)..."

          # license-checker has a bug with Node 24 where it crashes on some packages
          # We use error suppression and validate what we can
          LICENSE_OUTPUT=$(npx license-checker --summary 2>&1 || echo "LICENSE_CHECK_FAILED")

          if echo "$LICENSE_OUTPUT" | grep -q "LICENSE_CHECK_FAILED"; then
            echo "⚠️ License checker encountered an error (known Node 24 compatibility issue)"
            echo "Falling back to package.json license validation..."

            # Basic check: ensure our package and key deps have valid licenses
            if grep -q '"license": "MIT"' package.json; then
              echo "✅ Project license is MIT"
            else
              echo "❌ Project license is not MIT"
              exit 1
            fi
          elif echo "$LICENSE_OUTPUT" | grep -E "(GPL|AGPL)" | grep -v "MIT"; then
            echo "Found GPL/AGPL/LGPL licenses - these may be incompatible"
            npx license-checker 2>/dev/null | grep -E "(GPL|AGPL)" || true
            exit 1
          else
            echo "✅ No copyleft licenses found"
          fi

      - name: Validate license compatibility
        run: |
          echo "Running license audit..."

          # license-checker has known issues with Node 24
          # We attempt the check but don't fail on tool errors
          npm run license:audit 2>&1 || {
            EXIT_CODE=$?
            # Check if it's a tool crash vs actual license issue
            if npm run license:audit 2>&1 | grep -q "TypeError"; then
              echo "⚠️ License checker tool error (Node 24 compatibility issue)"
              echo "Skipping detailed license audit - SBOM will still be generated"
            else
              echo "License audit found issues"
              npm run license:check 2>&1 || true
              exit 1
            fi
          }
          echo "License check completed"

      - name: Generate SBOM
        run: |
          echo "Generating Software Bill of Materials..."
          mkdir -p sbom
          npm run sbom:prod || true

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90
