name: Combine Dependabot PRs

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  combine-dependabot-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find open Dependabot PRs
        id: find-prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: allPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const dependabotPRs = allPRs.filter(pr =>
              pr.user.login === 'dependabot[bot]' &&
              pr.head.ref.startsWith('dependabot/')
            );

            if (dependabotPRs.length === 0) {
              console.log('No open Dependabot PRs found');
              core.setOutput('has-prs', 'false');
              core.setOutput('count', '0');
              return { hasPRs: false, count: 0 };
            }

            console.log(`Found ${dependabotPRs.length} open Dependabot PRs`);

            // Filter out GitHub Actions PRs (workflow updates cannot be pushed with GITHUB_TOKEN)
            const nonWorkflowPRs = [];
            const skippedWorkflowPRs = [];

            for (const pr of dependabotPRs) {
              // Check if PR updates workflow files
              const { data: files } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });

              const hasWorkflowChanges = files.some(file =>
                file.filename.startsWith('.github/workflows/')
              );

              if (hasWorkflowChanges) {
                console.log(`⚠️ Skipping PR #${pr.number} - contains workflow file changes`);
                skippedWorkflowPRs.push(pr);
              } else {
                nonWorkflowPRs.push(pr);
              }
            }

            if (skippedWorkflowPRs.length > 0) {
              console.log(`\n⚠️ Skipped ${skippedWorkflowPRs.length} PR(s) with workflow changes:`);
              skippedWorkflowPRs.forEach(pr => {
                console.log(`  - #${pr.number}: ${pr.title}`);
              });
              console.log('\nNote: Workflow file updates require manual merge or a PAT with workflow permissions.');
            }

            if (nonWorkflowPRs.length === 0) {
              console.log('\n✓ No combinable Dependabot PRs found (all contain workflow changes)');
              core.setOutput('has-prs', 'false');
              core.setOutput('count', '0');
              return { hasPRs: false, count: 0 };
            }

            console.log(`\n✓ Found ${nonWorkflowPRs.length} combinable Dependabot PRs (excluding workflow updates)`);

            const prData = nonWorkflowPRs.map(pr => ({
              number: pr.number,
              title: pr.title,
              branch: pr.head.ref,
              url: pr.html_url,
              labels: pr.labels.map(l => l.name)
            }));

            core.setOutput('has-prs', 'true');
            core.setOutput('count', nonWorkflowPRs.length);
            core.setOutput('prs', JSON.stringify(prData));
            core.setOutput('skipped-workflow-prs', skippedWorkflowPRs.length);

            return { hasPRs: true, count: nonWorkflowPRs.length, prs: prData, skipped: skippedWorkflowPRs.length };

      - name: Exit if no PRs to combine
        if: steps.find-prs.outputs.has-prs != 'true'
        run: |
          echo "✓ No Dependabot PRs to combine. Exiting successfully."
          exit 0

      - name: Create or update combined branch
        if: steps.find-prs.outputs.has-prs == 'true'
        run: |
          # Check if combined branch exists on remote
          if git ls-remote --heads origin dependabot-combined | grep -q dependabot-combined; then
            echo "Combined branch exists, fetching and resetting to main"
            git fetch origin dependabot-combined
            git fetch origin main
            git checkout -B dependabot-combined origin/main
          else
            echo "Creating new combined branch from main"
            git fetch origin main
            git checkout -b dependabot-combined origin/main
          fi

      - name: Merge Dependabot PRs into combined branch
        if: steps.find-prs.outputs.has-prs == 'true'
        run: |
          prs='${{ steps.find-prs.outputs.prs }}'
          conflict_branches=""

          echo "$prs" | jq -r '.[] | .branch' | while read branch; do
            echo "Fetching and merging $branch..."

            # Verify branch exists before attempting merge
            if ! git fetch origin "$branch"; then
              echo "⚠️ Warning: Could not fetch $branch, skipping..."
              continue
            fi

            # Use merge with conventional commit format
            if git merge "origin/$branch" --no-ff --no-edit -m "chore(deps): merge $branch"; then
              echo "✓ Successfully merged $branch"
            else
              echo "✗ Merge conflict detected in $branch"
              git merge --abort
              conflict_branches="$conflict_branches $branch"
              echo "⚠️ Continuing with remaining branches..."
            fi
          done

          # Report conflicts at the end if any occurred
          if [ -n "$conflict_branches" ]; then
            echo "⚠️ The following branches had merge conflicts:$conflict_branches"
            echo "CONFLICT_BRANCHES=$conflict_branches" >> $GITHUB_ENV
            echo "Some branches could not be merged automatically. Manual intervention may be required."
          fi

      - name: Push combined branch
        if: steps.find-prs.outputs.has-prs == 'true'
        run: |
          git push origin dependabot-combined --force

      - name: Setup Node.js
        if: steps.find-prs.outputs.has-prs == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup environment
        if: steps.find-prs.outputs.has-prs == 'true'
        run: cp .env.example .env

      - name: Install dependencies
        if: steps.find-prs.outputs.has-prs == 'true'
        run: npm ci

      - name: Ensure Svelte Kit is in sync
        if: steps.find-prs.outputs.has-prs == 'true'
        run: npx svelte-kit sync

      - name: Run validation tests
        if: steps.find-prs.outputs.has-prs == 'true'
        id: validation
        run: |
          echo "🔍 Running linting..."
          if ! npm run lint; then
            echo "VALIDATION_FAILED=lint" >> $GITHUB_ENV
            echo "❌ Linting failed"
            exit 1
          fi

          echo "🔍 Running type checking..."
          if ! npm run type-check; then
            echo "VALIDATION_FAILED=type-check" >> $GITHUB_ENV
            echo "❌ Type checking failed"
            exit 1
          fi

          echo "🔍 Running svelte-check..."
          if ! npm run check; then
            echo "VALIDATION_FAILED=svelte-check" >> $GITHUB_ENV
            echo "❌ Svelte check failed"
            exit 1
          fi

          echo "🧪 Running unit tests..."
          if ! npm run test:unit; then
            echo "VALIDATION_FAILED=tests" >> $GITHUB_ENV
            echo "❌ Unit tests failed"
            exit 1
          fi

          echo "🏗️ Running build..."
          if ! npm run build; then
            echo "VALIDATION_FAILED=build" >> $GITHUB_ENV
            echo "❌ Build failed"
            exit 1
          fi

          echo "VALIDATION_PASSED=true" >> $GITHUB_ENV
          echo "✅ All validation checks passed!"

      - name: Analyze updates and generate PR content
        if: steps.find-prs.outputs.has-prs == 'true'
        id: pr-content
        uses: actions/github-script@v7
        with:
          script: |
            const prs = JSON.parse('${{ steps.find-prs.outputs.prs }}');

            // Parse dependency updates
            const updates = {
              major: [],
              minor: [],
              patch: [],
              actions: [],
              other: []
            };

            let hasMajor = false;
            let hasActions = false;

            for (const pr of prs) {
              const title = pr.title;

              // Check if it's a GitHub Actions update
              if (title.includes('github-actions') || pr.labels.includes('github_actions')) {
                hasActions = true;
                const match = title.match(/bump (.+) from (.+) to (.+)/i);
                if (match) {
                  const [, actionName, fromVersion, toVersion] = match;
                  updates.actions.push({
                    name: actionName,
                    from: fromVersion,
                    to: toVersion,
                    prNumber: pr.number,
                    url: pr.url
                  });
                } else {
                  updates.actions.push({
                    title: title,
                    prNumber: pr.number,
                    url: pr.url
                  });
                }
                continue;
              }

              // Parse npm package updates
              const match = title.match(/bump (.+) from (.+) to (.+)/i);
              if (match) {
                const [, packageName, fromVersion, toVersion] = match;
                const versionType = getVersionType(fromVersion, toVersion);

                if (versionType === 'major') hasMajor = true;

                updates[versionType].push({
                  name: packageName,
                  from: fromVersion,
                  to: toVersion,
                  prNumber: pr.number,
                  url: pr.url
                });
              } else {
                updates.other.push({
                  title: title,
                  prNumber: pr.number,
                  url: pr.url
                });
              }
            }

            function getVersionType(from, to) {
              // Remove any 'v' prefix and clean version strings
              const cleanFrom = from.replace(/^v/, '').split('.').map(n => parseInt(n.replace(/\D/g, '')) || 0);
              const cleanTo = to.replace(/^v/, '').split('.').map(n => parseInt(n.replace(/\D/g, '')) || 0);

              if (cleanTo[0] > cleanFrom[0]) return 'major';
              if (cleanTo[1] > cleanFrom[1]) return 'minor';
              if (cleanTo[2] > cleanFrom[2]) return 'patch';
              return 'patch'; // Default to patch for unclear cases
            }

            // Generate conventional commit title
            const count = prs.length;
            const title = `chore(deps): update ${count} ${count === 1 ? 'dependency' : 'dependencies'}${hasMajor ? ' ⚠️' : ''}`;

            // Generate PR body
            let body = '## 🤖 Combined Dependabot Updates\n\n';
            body += `This PR combines **${count}** Dependabot update${count === 1 ? '' : 's'} into a single changeset.\n\n`;

            if (hasMajor) {
              body += '> ⚠️ **Warning:** This PR contains major version updates that may include breaking changes.\n\n';
            }

            body += '### Summary\n\n';
            const summary = [];
            if (updates.major.length > 0) summary.push(`${updates.major.length} major update${updates.major.length === 1 ? '' : 's'}`);
            if (updates.minor.length > 0) summary.push(`${updates.minor.length} minor update${updates.minor.length === 1 ? '' : 's'}`);
            if (updates.patch.length > 0) summary.push(`${updates.patch.length} patch update${updates.patch.length === 1 ? '' : 's'}`);
            if (updates.actions.length > 0) summary.push(`${updates.actions.length} GitHub Actions update${updates.actions.length === 1 ? '' : 's'}`);
            body += `- ${summary.join('\n- ')}\n\n`;
            body += '---\n\n';

            // Major Updates
            if (updates.major.length > 0) {
              body += '### ⚠️ Major Updates (Breaking Changes)\n\n';
              updates.major.forEach(u => {
                body += `- **${u.name}**: ${u.from} → ${u.to} ([#${u.prNumber}](${u.url}))\n`;
              });
              body += '\n';
            }

            // Minor Updates
            if (updates.minor.length > 0) {
              body += '### ✨ Minor Updates (New Features)\n\n';
              updates.minor.forEach(u => {
                body += `- **${u.name}**: ${u.from} → ${u.to} ([#${u.prNumber}](${u.url}))\n`;
              });
              body += '\n';
            }

            // Patch Updates
            if (updates.patch.length > 0) {
              body += '### 🐛 Patch Updates (Bug Fixes)\n\n';
              updates.patch.forEach(u => {
                body += `- **${u.name}**: ${u.from} → ${u.to} ([#${u.prNumber}](${u.url}))\n`;
              });
              body += '\n';
            }

            // GitHub Actions Updates
            if (updates.actions.length > 0) {
              body += '### 🔧 GitHub Actions Updates\n\n';
              updates.actions.forEach(u => {
                if (u.name) {
                  body += `- **${u.name}**: ${u.from} → ${u.to} ([#${u.prNumber}](${u.url}))\n`;
                } else {
                  body += `- ${u.title} ([#${u.prNumber}](${u.url}))\n`;
                }
              });
              body += '\n';
            }

            // Other Updates
            if (updates.other.length > 0) {
              body += '### 📦 Other Updates\n\n';
              updates.other.forEach(u => {
                body += `- ${u.title} ([#${u.prNumber}](${u.url}))\n`;
              });
              body += '\n';
            }

            body += '---\n\n';
            body += '### ✅ Validation Status\n\n';
            body += '- ✓ Linting passed\n';
            body += '- ✓ Type checking passed\n';
            body += '- ✓ Unit tests passed\n';
            body += '- ✓ Build succeeded\n\n';
            body += '**PR validation will run automatically when this PR is updated.**\n\n';
            body += '---\n\n';
            body += '*After merging this PR, all individual Dependabot PRs will be automatically closed.*\n';

            core.setOutput('title', title);
            core.setOutput('body', body);
            core.setOutput('has-major', hasMajor.toString());

            return { title, body, hasMajor };

      - name: Check for existing combined PR
        if: steps.find-prs.outputs.has-prs == 'true'
        id: check-existing-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:dependabot-combined`,
              base: 'main'
            });

            if (prs.length > 0) {
              console.log(`Found existing combined PR #${prs[0].number}`);
              core.setOutput('exists', 'true');
              core.setOutput('pr-number', prs[0].number);
              return { exists: true, prNumber: prs[0].number };
            }

            console.log('No existing combined PR found');
            core.setOutput('exists', 'false');
            return { exists: false };

      - name: Create or update combined PR
        if: steps.find-prs.outputs.has-prs == 'true'
        id: combined-pr
        env:
          PR_TITLE: ${{ steps.pr-content.outputs.title }}
          PR_BODY: ${{ steps.pr-content.outputs.body }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.PR_TITLE;
            const body = process.env.PR_BODY;
            const exists = '${{ steps.check-existing-pr.outputs.exists }}' === 'true';
            const hasMajor = '${{ steps.pr-content.outputs.has-major }}' === 'true';

            let labels = ['dependencies', 'automated'];
            if (hasMajor) {
              labels.push('breaking-change');
            }

            if (exists) {
              const prNumber = parseInt('${{ steps.check-existing-pr.outputs.pr-number }}');

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                title: title,
                body: body
              });

              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: labels
              });

              console.log(`✓ Updated existing PR #${prNumber}`);
              core.setOutput('pr-number', prNumber);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                head: 'dependabot-combined',
                base: 'main',
                body: body
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labels
              });

              console.log(`✓ Created new combined PR #${pr.number}: ${pr.html_url}`);
              core.setOutput('pr-number', pr.number);
            }

      - name: Comment on individual Dependabot PRs
        if: steps.find-prs.outputs.has-prs == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prs = JSON.parse('${{ steps.find-prs.outputs.prs }}');
            const combinedPrNumber = '${{ steps.combined-pr.outputs.pr-number }}';

            // Validate we have a PR number before commenting
            if (!combinedPrNumber) {
              console.log('⚠️ No combined PR number available, skipping comments');
              return;
            }

            for (const pr of prs) {
              const message = `🤖 **This update has been combined with other Dependabot updates**\n\n` +
                `➡️ See combined PR: #${combinedPrNumber}\n\n` +
                `This PR will remain open until the combined PR is merged, then it will be automatically closed.\n\n` +
                `---\n` +
                `*Individual Dependabot PRs are no longer merged separately to maintain a clean commit history.*`;

              try {
                // Check if we already commented
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number
                });

                const botComment = comments.find(c =>
                  c.user.login === 'github-actions[bot]' &&
                  c.body.includes('This update has been combined')
                );

                if (botComment) {
                  // Update existing comment
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body: message
                  });
                  console.log(`✓ Updated comment on PR #${pr.number}`);
                } else {
                  // Create new comment
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: message
                  });
                  console.log(`✓ Commented on PR #${pr.number}`);
                }
              } catch (error) {
                console.log(`⚠️ Failed to comment on PR #${pr.number}: ${error.message}`);
                // Continue with other PRs even if one fails
              }
            }

      - name: Generate summary
        if: steps.find-prs.outputs.has-prs == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const count = parseInt('${{ steps.find-prs.outputs.count }}');
            const prNumber = '${{ steps.combined-pr.outputs.pr-number }}';
            const hasMajor = '${{ steps.pr-content.outputs.has-major }}' === 'true';
            const conflictBranches = process.env.CONFLICT_BRANCHES || '';
            const skippedWorkflowPRs = parseInt('${{ steps.find-prs.outputs.skipped-workflow-prs }}') || 0;

            core.summary
              .addHeading('🤖 Dependabot PRs Combined')
              .addRaw(`Successfully combined ${count} Dependabot update${count === 1 ? '' : 's'}`, true)
              .addBreak();

            if (prNumber) {
              core.summary.addRaw(`📦 Combined PR: #${prNumber}`, true);
            } else {
              core.summary.addRaw('⚠️ Combined PR creation may have failed', true);
            }

            if (hasMajor) {
              core.summary
                .addBreak()
                .addRaw('⚠️ **Contains major version updates**', true);
            }

            if (conflictBranches) {
              core.summary
                .addBreak()
                .addRaw(`⚠️ **Merge conflicts detected in:** ${conflictBranches}`, true)
                .addRaw('These branches were skipped and may need manual intervention.', true);
            }

            if (skippedWorkflowPRs > 0) {
              core.summary
                .addBreak()
                .addRaw(`ℹ️ **Skipped ${skippedWorkflowPRs} PR(s) with workflow file changes**`, true)
                .addRaw('Workflow file updates require manual merge or a PAT with workflow permissions.', true);
            }

            core.summary.write();
