name: PR Validation

on:
  pull_request:
    branches: [main, next, beta, alpha]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup environment
        run: cp .env.example .env

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            .svelte-kit
            build
            .vercel
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Ensure Svelte Kit is in sync
        run: npx svelte-kit sync

      # Detect changes for conditional testing
      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'static/**'
              - 'app.html'
              - '*.config.js'
              - '*.config.ts'
              - 'package.json'
            backend:
              - 'src/routes/api/**'
              - 'src/lib/server/**'
            tests:
              - 'tests/**'
              - 'src/**/*.test.ts'
              - 'src/**/*.test.js'
              - 'playwright.config.ts'
            docs:
              - '*.md'
              - 'docs/**'
              - '.github/**/*.md'
            config:
              - '.github/workflows/**'
              - 'package.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'tailwind.config.js'
            dependencies:
              - 'package-lock.json'
              - 'package.json'

      # Smoke test für nur Dokumentations-Änderungen
      - name: Smoke test for docs-only changes
        if: steps.changes.outputs.docs == 'true' && steps.changes.outputs.frontend != 'true' && steps.changes.outputs.backend != 'true'
        run: |
          echo "🚀 Running smoke test for documentation changes only"
          npm run lint
          echo "✅ Smoke test passed - documentation changes validated"

      # Commit message validation nur für normale PRs (nicht Dependabot)
      - name: Validate commit messages
        if: github.actor != 'dependabot[bot]' && (steps.changes.outputs.docs != 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true')
        run: |
          echo "Validating commit messages from origin/main to HEAD..."
          npx commitlint --from=origin/main --to=HEAD --verbose

      # Affected testing - nur relevante Tests basierend auf Änderungen
      - name: Run affected tests (frontend changes)
        if: steps.changes.outputs.frontend == 'true' && (steps.changes.outputs.docs != 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true')
        run: |
          echo "🎯 Running tests affected by frontend changes"
          npm run test:quick

      - name: Run affected tests (backend changes)
        if: steps.changes.outputs.backend == 'true' && (steps.changes.outputs.docs != 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true')
        run: |
          echo "🎯 Running tests affected by backend changes"
          npm run test:quick

      - name: Run affected tests (config/dependency changes)
        if: (steps.changes.outputs.config == 'true' || steps.changes.outputs.dependencies == 'true') && (steps.changes.outputs.docs != 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true')
        run: |
          echo "🎯 Running full test suite due to config/dependency changes"
          npm run test:quick

      # Test Coverage für Code-Änderungen
      - name: Generate test coverage
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        run: |
          echo "📊 Generating test coverage report"
          npm run test:unit -- --coverage --run
        continue-on-error: true

      - name: Upload coverage reports
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 30

      # Type checking and Svelte check
      - name: Run type checking
        if: steps.changes.outputs.docs != 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        run: npm run type-check

      - name: Run Svelte check
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.config == 'true'
        run: npm run check

      # License checking für Dependency-Änderungen
      - name: Check licenses
        if: steps.changes.outputs.dependencies == 'true' || github.actor == 'dependabot[bot]'
        run: |
          echo "⚙️ Checking license compliance"
          npx license-checker --onlyAllow 'MIT;ISC;BSD;Apache-2.0;BSD-2-Clause;BSD-3-Clause;CC0-1.0;Unlicense;WTFPL;0BSD' --excludePrivatePackages || {
            echo "⚠️ License check failed - found potentially problematic licenses"
            echo "Running detailed license report..."
            npx license-checker --detailed
            exit 1
          }
        continue-on-error: true

      # Build application
      - name: Build application
        if: steps.changes.outputs.docs != 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true'
        run: npm run build

      # E2E tests für relevante Änderungen (affected testing)
      - name: Run E2E tests
        if: >
          github.event.pull_request.draft == false && 
          (
            steps.changes.outputs.frontend == 'true' ||
            steps.changes.outputs.backend == 'true' ||
            github.actor == 'dependabot[bot]' ||
            contains(github.event.pull_request.title, 'breaking')
          ) &&
          (steps.changes.outputs.docs != 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.backend == 'true')
        run: |
          echo "🧪 Running E2E tests for affected areas"
          npm run test:e2e

      # Dependabot-spezifische Aktionen
      - name: Get Dependabot metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v1
        id: dependabot-metadata

      - name: Label Dependabot PR
        if: github.actor == 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            const updateType = '${{ steps.dependabot-metadata.outputs.update-type }}';
            const dependencyType = '${{ steps.dependabot-metadata.outputs.dependency-type }}';

            let labels = ['dependencies', 'dependabot'];

            // Label nach Update-Typ
            if (updateType.includes('major')) {
              labels.push('major-update', 'breaking-change');
            } else if (updateType.includes('minor')) {
              labels.push('minor-update');
            } else if (updateType.includes('patch')) {
              labels.push('patch-update');
            }

            // Label nach Dependency-Typ
            if (dependencyType === 'direct:development') {
              labels.push('dev-dependency');
            } else if (dependencyType === 'direct:production') {
              labels.push('production-dependency');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });

      - name: Add Dependabot status comment
        if: github.actor == 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            const updateType = '${{ steps.dependabot-metadata.outputs.update-type }}';
            let emoji = '✅';
            let status = 'ready for combination';

            if (updateType.includes('major')) {
              emoji = '⚠️';
              status = 'contains major updates - needs review';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} **Tests passed!** This PR is ${status}.\n\n` +
                    `This PR will be automatically combined with other Dependabot updates in a daily batch. ` +
                    `Individual Dependabot PRs are no longer auto-merged to maintain a cleaner commit history.`
            });

      # Normale PR Labeling (nicht Dependabot)
      - name: Label PR based on commit types
        if: github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: commits } = await github.rest.pulls.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              
              // Get existing labels in the repository
              const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              
              const existingLabelNames = repoLabels.map(label => label.name);
              
              let labels = [];
              let hasBreakingChanges = false;
              
              for (const commit of commits) {
                const message = commit.commit.message;
                
                // Check for breaking changes
                if (message.includes('BREAKING CHANGE') || message.includes('!:')) {
                  hasBreakingChanges = true;
                  if (existingLabelNames.includes('breaking-change')) {
                    labels.push('breaking-change');
                  }
                }
                
                // Determine type
                const match = message.match(/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/);
                if (match) {
                  const type = match[1];
                  let labelName = '';
                  
                  switch (type) {
                    case 'feat':
                      labelName = 'feature';
                      break;
                    case 'fix':
                      labelName = 'bugfix';
                      break;
                    case 'docs':
                      labelName = 'documentation';
                      break;
                    case 'refactor':
                      labelName = 'refactor';
                      break;
                    case 'perf':
                      labelName = 'performance';
                      break;
                    case 'test':
                      labelName = 'test';
                      break;
                    case 'build':
                    case 'ci':
                      labelName = 'build';
                      break;
                    case 'chore':
                      labelName = 'maintenance';
                      break;
                  }
                  
                  // Only add label if it exists in the repository
                  if (labelName && existingLabelNames.includes(labelName)) {
                    labels.push(labelName);
                  }
                }
              }
              
              // Remove duplicates
              labels = [...new Set(labels)];
              
              if (labels.length > 0) {
                console.log(`Adding labels: ${labels.join(', ')}`);
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: labels
                });
              } else {
                console.log('No matching labels found in repository');
              }
            } catch (error) {
              console.log(`Failed to add labels: ${error.message}`);
              // Don't fail the workflow if labeling fails
            }