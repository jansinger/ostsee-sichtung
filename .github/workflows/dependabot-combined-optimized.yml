name: Dependabot Combined PR

on:
  schedule:
    # Läuft täglich um 9:00 UTC (10:00 CET)
    - cron: '0 9 * * *'
  workflow_dispatch: # Manueller Trigger

jobs:
  combine-dependabot-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get Dependabot PRs
        id: get-prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: 'dependabot/',
              per_page: 100
            });

            // Nur PRs die bereits durch den unified validation workflow gegangen sind
            const dependabotPRs = [];

            for (const pr of pullRequests) {
              if (pr.user.login === 'dependabot[bot]' && 
                  pr.head.ref.startsWith('dependabot/')) {
                
                // Prüfe ob der PR bereits validiert wurde
                const { data: checkRuns } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                });
                
                const hasPassedValidation = checkRuns.check_runs.some(check => 
                  check.name === 'Validate Pull Request' && 
                  check.status === 'completed' && 
                  check.conclusion === 'success'
                );
                
                if (hasPassedValidation) {
                  dependabotPRs.push(pr);
                } else {
                  console.log(`Skipping PR #${pr.number}: Not yet validated or validation failed`);
                }
              }
            }

            if (dependabotPRs.length === 0) {
              console.log('No validated Dependabot PRs found');
              return { prs: [], count: 0 };
            }

            console.log(`Found ${dependabotPRs.length} validated Dependabot PRs`);

            const prDetails = dependabotPRs.map(pr => ({
              number: pr.number,
              title: pr.title,
              branch: pr.head.ref,
              url: pr.html_url,
              body: pr.body
            }));

            core.setOutput('count', dependabotPRs.length);
            core.setOutput('prs', JSON.stringify(prDetails));

            return { prs: prDetails, count: dependabotPRs.length };

      - name: Exit if no PRs
        if: steps.get-prs.outputs.count == '0'
        run: |
          echo "No validated Dependabot PRs to combine. Exiting."
          exit 0

      - name: Create combined branch
        if: steps.get-prs.outputs.count != '0'
        run: |
          # Erstelle einen neuen Branch für die kombinierten Updates
          BRANCH_NAME="chore/dependabot-combined-$(date +%Y-%m-%d-%H%M%S)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

          # Lösche eventuell existierenden Branch erst
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

      - name: Merge Dependabot branches
        if: steps.get-prs.outputs.count != '0'
        id: merge-branches
        env:
          PRS_JSON: ${{ steps.get-prs.outputs.prs }}
        run: |
          SUCCESSFUL_MERGES=()
          CONFLICTED_PRS=()
          SKIPPED_PRS=()
          
          # Parse PR details und versuche jeden Branch zu mergen
          echo "$PRS_JSON" | jq -r '.[] | "\(.number) \(.branch) \(.title)"' | while IFS=' ' read -r pr_number branch title; do
            echo "Attempting to merge $branch: $title (PR #$pr_number)"
            
            # Fetch den Dependabot branch
            git fetch origin "$branch"
            
            # Prüfe ob es bereits Konflikte geben würde
            if git merge-tree $(git merge-base HEAD "origin/$branch") HEAD "origin/$branch" | grep -q '<<<<<<< '; then
              echo "❌ Pre-merge conflict detected for $branch (PR #$pr_number)"
              echo "$pr_number|$branch|$title" >> /tmp/conflicted_prs.txt
              continue
            fi
            
            # Versuche den Merge
            if git merge "origin/$branch" --no-ff --no-edit -m "merge: $title"; then
              echo "✅ Successfully merged $branch (PR #$pr_number)"
              echo "$pr_number|$branch|$title" >> /tmp/successful_merges.txt
            else
              # Merge fehlgeschlagen - Reset und als Konflikt markieren
              echo "❌ Merge conflict for $branch (PR #$pr_number)"
              git merge --abort 2>/dev/null || true
              git reset --hard HEAD
              echo "$pr_number|$branch|$title" >> /tmp/conflicted_prs.txt
            fi
          done

          # Lese die Ergebnisse
          if [ -f /tmp/successful_merges.txt ]; then
            SUCCESSFUL_COUNT=$(wc -l < /tmp/successful_merges.txt)
            echo "successful_count=$SUCCESSFUL_COUNT" >> $GITHUB_OUTPUT
            echo "successful_merges<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/successful_merges.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "successful_count=0" >> $GITHUB_OUTPUT
            echo "successful_merges=" >> $GITHUB_OUTPUT
          fi

          if [ -f /tmp/conflicted_prs.txt ]; then
            CONFLICTED_COUNT=$(wc -l < /tmp/conflicted_prs.txt)
            echo "conflicted_count=$CONFLICTED_COUNT" >> $GITHUB_OUTPUT
            echo "conflicted_prs<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/conflicted_prs.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "conflicted_count=0" >> $GITHUB_OUTPUT
            echo "conflicted_prs=" >> $GITHUB_OUTPUT
          fi

          # Zeige was tatsächlich gemerged wurde
          echo "=== Merge Summary ==="
          echo "Successful merges: $SUCCESSFUL_COUNT"
          echo "Conflicted PRs: $CONFLICTED_COUNT"
          
          if [ "$SUCCESSFUL_COUNT" -gt 0 ]; then
            echo "=== Merged changes ==="
            git log --oneline -10
            git status
          fi

      - name: Handle conflicted PRs
        if: steps.merge-branches.outputs.conflicted_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const conflictedPRs = `${{ steps.merge-branches.outputs.conflicted_prs }}`;
            
            if (!conflictedPRs) {
              console.log('No conflicted PRs to handle');
              return;
            }
            
            const conflicts = conflictedPRs.trim().split('\n');
            
            for (const conflict of conflicts) {
              const [prNumber, branch, ...titleParts] = conflict.split('|');
              const title = titleParts.join('|');
              
              console.log(`Handling conflict for PR #${prNumber}: ${title}`);
              
              // Kommentar mit @dependabot rebase
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(prNumber),
                body: '🔄 **Merge Conflict Detected**\n\nThis PR has merge conflicts that prevent it from being included in the automated dependency combination.\n\n@dependabot rebase\n\nOnce rebased, this PR will be automatically included in the next dependency combination cycle.\n\n---\n*This is an automated message from the Dependabot Combined PR workflow.*'
              });
              
              console.log(`Added rebase comment to PR #${prNumber}`);
            }

      - name: Generate conventional commit message
        if: steps.merge-branches.outputs.successful_count != '0'
        id: commit-message
        uses: actions/github-script@v7
        env:
          SUCCESSFUL_MERGES: ${{ steps.merge-branches.outputs.successful_merges }}
        with:
          script: |
            const successfulMerges = `${{ steps.merge-branches.outputs.successful_merges }}`;
            
            if (!successfulMerges) {
              console.log('No successful merges to process');
              return;
            }
            
            // Parse successful merges: "pr_number|branch|title"
            const merges = successfulMerges.trim().split('\n');
            const prs = merges.map(merge => {
              const [number, branch, ...titleParts] = merge.split('|');
              return {
                number: parseInt(number),
                branch,
                title: titleParts.join('|')
              };
            });

            // Gruppiere Updates nach Typ
            const updates = {
              major: [],
              minor: [],
              patch: [],
              other: []
            };

            prs.forEach(pr => {
              const title = pr.title;
              const match = title.match(/bump (.+) from (.+) to (.+)/i);
              
              if (match) {
                const [, packageName, fromVersion, toVersion] = match;
                const versionType = getVersionType(fromVersion, toVersion);
                updates[versionType].push({ packageName, fromVersion, toVersion });
              } else {
                updates.other.push({ title: title });
              }
            });

            function getVersionType(from, to) {
              const fromParts = from.split('.').map(Number);
              const toParts = to.split('.').map(Number);
              
              if (toParts[0] > fromParts[0]) return 'major';
              if (toParts[1] > fromParts[1]) return 'minor';
              if (toParts[2] > fromParts[2]) return 'patch';
              return 'other';
            }

            // Erstelle Conventional Commit Message
            let commitType = 'chore';
            let scope = 'deps';

            // Bei Major Updates verwende 'build' für mehr Aufmerksamkeit
            if (updates.major.length > 0) {
              commitType = 'build';
            }

            let subject = `update ${prs.length} dependencies`;
            if (prs.length === 1) {
              subject = `update ${prs[0].title.replace(/^bump /i, '').replace(/ from .+ to .+/i, '')}`;
            }

            let body = '### 📋 Summary\n\n';
            body += `This PR combines ${prs.length} dependency updates that have all passed individual validation.\n\n`;

            // Major Updates
            if (updates.major.length > 0) {
              body += '### ⚠️ Major Updates\n\n';
              updates.major.forEach(u => {
                body += `- ${u.packageName}: ${u.fromVersion} → ${u.toVersion}\n`;
              });
              body += '\n';
            }

            // Minor Updates
            if (updates.minor.length > 0) {
              body += '### ✨ Minor Updates\n\n';
              updates.minor.forEach(u => {
                body += `- ${u.packageName}: ${u.fromVersion} → ${u.toVersion}\n`;
              });
              body += '\n';
            }

            // Patch Updates
            if (updates.patch.length > 0) {
              body += '### 🐛 Patch Updates\n\n';
              updates.patch.forEach(u => {
                body += `- ${u.packageName}: ${u.fromVersion} → ${u.toVersion}\n`;
              });
              body += '\n';
            }

            // Andere Updates
            if (updates.other.length > 0) {
              body += '### 📦 Other Updates\n\n';
              updates.other.forEach(u => {
                body += `- ${u.title}\n`;
              });
              body += '\n';
            }

            body += '### 🔗 Original PRs\n\n';
            prs.forEach(pr => {
              body += `- #${pr.number}: ${pr.title} ✅\n`;
            });

            body += '\n### ✅ Pre-validated\n\n';
            body += 'All included dependencies have already passed the full test suite individually.';

            const commitMessage = `${commitType}(${scope}): ${subject}`;
            const hasMajor = updates.major.length > 0;

            core.setOutput('commit-message', commitMessage);
            core.setOutput('pr-body', body);
            core.setOutput('has-major', hasMajor);

            return { commitMessage, body, hasMajor };

      # Keine erneuten Tests - alle PRs wurden bereits einzeln validiert!
      - name: Commit changes
        if: steps.merge-branches.outputs.successful_count != '0'
        id: commit-changes
        run: |
          git add -A

          # Prüfe ob es Änderungen zu commiten gibt
          if git diff --staged --quiet; then
            echo "No changes to commit - all branches merged cleanly"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          git commit -m "${{ steps.commit-message.outputs.commit-message }}"
          git push origin "$BRANCH_NAME"

      - name: Create combined PR
        if: steps.merge-branches.outputs.successful_count != '0' && steps.commit-changes.outputs.has_changes == 'true'
        id: create-pr
        uses: actions/github-script@v7
        env:
          COMMIT_MESSAGE: ${{ steps.commit-message.outputs.commit-message }}
          PR_BODY: ${{ steps.commit-message.outputs.pr-body }}
          HAS_MAJOR: ${{ steps.commit-message.outputs.has-major }}
        with:
          script: |
            const commitMessage = process.env.COMMIT_MESSAGE;
            const prBody = process.env.PR_BODY;
            const hasMajor = process.env.HAS_MAJOR === 'true';

            let title = commitMessage;
            let labels = ['dependencies', 'pre-validated'];

            if (hasMajor) {
              labels.push('breaking-change');
              title += ' ⚠️';
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              head: process.env.BRANCH_NAME,
              base: 'main',
              body: prBody
            });

            // Labels hinzufügen
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: labels
            });

            console.log(`Created combined PR: ${pr.html_url}`);
            core.setOutput('pr-number', pr.number);
            core.setOutput('pr-url', pr.html_url);

            return pr;

      - name: Close individual Dependabot PRs
        if: steps.merge-branches.outputs.successful_count != '0' && steps.commit-changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          SUCCESSFUL_MERGES: ${{ steps.merge-branches.outputs.successful_merges }}
          COMBINED_PR_NUMBER: ${{ steps.create-pr.outputs.pr-number }}
          COMBINED_PR_URL: ${{ steps.create-pr.outputs.pr-url }}
        with:
          script: |
            const successfulMerges = process.env.SUCCESSFUL_MERGES;
            const combinedPrNumber = process.env.COMBINED_PR_NUMBER;
            const combinedPrUrl = process.env.COMBINED_PR_URL;

            if (!successfulMerges) {
              console.log('No successful merges to close');
              return;
            }
            
            // Parse successful merges: "pr_number|branch|title"
            const merges = successfulMerges.trim().split('\n');
            const prs = merges.map(merge => {
              const [number, branch, ...titleParts] = merge.split('|');
              return {
                number: parseInt(number),
                branch,
                title: titleParts.join('|')
              };
            });

            for (const pr of prs) {
              console.log(`Closing PR #${pr.number}: ${pr.title}`);
              
              // Kommentar hinterlassen
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🤖 This dependency update has been combined with others into a single PR: ${combinedPrUrl}\n\n✅ All tests have already passed for this update.`
              });
              
              // PR schließen
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            }

      - name: Auto-merge if safe
        if: steps.merge-branches.outputs.successful_count != '0' && steps.commit-changes.outputs.has_changes == 'true' && steps.commit-message.outputs.has-major == 'false'
        run: |
          # Nur auto-mergen wenn keine Major Updates dabei sind
          gh pr merge ${{ steps.create-pr.outputs.pr-number }} --auto --squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major updates
        if: steps.merge-branches.outputs.successful_count != '0' && steps.commit-changes.outputs.has_changes == 'true' && steps.commit-message.outputs.has-major == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create-pr.outputs.pr-number }},
              body: '⚠️ **This PR contains major version updates** that may include breaking changes. Please review carefully before merging.\n\n✅ All individual dependencies have already passed the full test suite.'
            });

      - name: Summary when no changes needed
        if: steps.merge-branches.outputs.successful_count != '0' && steps.commit-changes.outputs.has_changes == 'false'
        run: |
          echo "✅ All Dependabot PRs merged cleanly without conflicts"
          echo "No additional commits needed - changes were already integrated"
          echo "Individual PRs will be closed automatically"

      - name: Close individual PRs when no changes needed
        if: steps.merge-branches.outputs.successful_count != '0' && steps.commit-changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        env:
          SUCCESSFUL_MERGES: ${{ steps.merge-branches.outputs.successful_merges }}
        with:
          script: |
            const successfulMerges = process.env.SUCCESSFUL_MERGES;

            if (!successfulMerges) {
              console.log('No successful merges to close');
              return;
            }
            
            // Parse successful merges: "pr_number|branch|title"
            const merges = successfulMerges.trim().split('\n');
            const prs = merges.map(merge => {
              const [number, branch, ...titleParts] = merge.split('|');
              return {
                number: parseInt(number),
                branch,
                title: titleParts.join('|')
              };
            });

            for (const pr of prs) {
              console.log(`Closing PR #${pr.number}: ${pr.title}`);
              
              // Kommentar hinterlassen
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🤖 This dependency update was successfully merged into the main branch without conflicts.\n\n✅ No additional changes were needed - the update is already integrated.`
              });
              
              // PR schließen
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            }

      - name: Workflow Summary
        if: always() && steps.get-prs.outputs.count != '0'
        run: |
          echo "=== Dependabot Combined PR Workflow Summary ==="
          echo "Total PRs found: ${{ steps.get-prs.outputs.count }}"
          echo "Successfully merged: ${{ steps.merge-branches.outputs.successful_count || 0 }}"
          echo "Conflicted PRs: ${{ steps.merge-branches.outputs.conflicted_count || 0 }}"
          
          if [ "${{ steps.merge-branches.outputs.successful_count || 0 }}" -gt "0" ]; then
            echo "✅ Successfully processed PRs have been combined or integrated"
          fi
          
          if [ "${{ steps.merge-branches.outputs.conflicted_count || 0 }}" -gt "0" ]; then
            echo "🔄 Conflicted PRs have been marked for rebase by Dependabot"
            echo "They will be included in the next workflow run after rebase"
          fi
          
          if [ "${{ steps.merge-branches.outputs.successful_count || 0 }}" -eq "0" ] && [ "${{ steps.merge-branches.outputs.conflicted_count || 0 }}" -eq "0" ]; then
            echo "ℹ️ No changes needed - all PRs were already clean"
          fi
