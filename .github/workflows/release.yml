name: Release

on:
  push:
    branches:
      - main
      - next
      - beta
      - alpha
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/alpha'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup environment
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Generate SBOM
        run: |
          npm run sbom:generate
          npm run sbom:prod
          npm run sbom:check || true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom/*.json
            sbom/*.xml
          retention-days: 90

      - name: Prepare Docker deployment assets
        run: |
          mkdir -p docker-release
          cp docker-compose.production.yml docker-release/
          cp .env.example docker-release/
          cp -r monitoring docker-release/ || true

      - name: Upload Docker deployment assets
        uses: actions/upload-artifact@v5
        with:
          name: docker-deployment-${{ github.sha }}
          path: docker-release/
          retention-days: 90

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
        run: npx semantic-release
