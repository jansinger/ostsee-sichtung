# ============================================
# Prometheus Configuration for Ostsee-Tiere
# ============================================
# This configuration sets up metric collection for the application,
# database, and system resources.

global:
  scrape_interval: 15s # Scrape targets every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  scrape_timeout: 10s # Timeout for scraping

  # Attach these labels to any time series or alerts
  external_labels:
    monitor: 'ostsee-tiere-monitor'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # ============================================
  # Prometheus self-monitoring
  # ============================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ============================================
  # Application metrics
  # ============================================
  - job_name: 'ostsee-tiere-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'app'
          component: 'sveltekit'

  # ============================================
  # PostgreSQL metrics (via postgres_exporter)
  # ============================================
  # Uncomment if you add postgres_exporter to docker-compose
  # - job_name: 'postgresql'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'database'
  #         component: 'postgresql'

  # ============================================
  # Node Exporter (System metrics)
  # ============================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'
          component: 'node-exporter'

  # ============================================
  # Docker container metrics (via cAdvisor)
  # ============================================
  # Uncomment if you add cAdvisor to docker-compose
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #       labels:
  #         service: 'containers'
  #         component: 'cadvisor'
