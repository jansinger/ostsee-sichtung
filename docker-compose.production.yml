# ============================================
# Docker Compose Production Configuration
# ============================================
# Production-ready setup for Ostsee-Tiere platform
# Includes: Application, PostgreSQL with PostGIS, Prometheus, Grafana
#
# Quick Start:
#   1. Copy .env.docker to .env and configure
#   2. docker compose -f docker-compose.production.yml up -d
#   3. Access app at http://localhost:3000

version: '3.9'

services:
  # ============================================
  # Application Service
  # ============================================
  app:
    image: ghcr.io/jansinger/ostsee-sichtung:latest
    container_name: ostsee-tiere-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Node.js Configuration
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # Database Connection
      DATABASE_POSTGRES_URL: ${DATABASE_POSTGRES_URL}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-ostsee}
      PGHOST: ${PGHOST:-db}
      PGPORT: ${PGPORT:-5432}

      # Storage Configuration
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_PATH: /app/uploads

      # Vercel Blob Storage (if used)
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}

      # AWS S3 Storage (if used)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}

      # Google Cloud Storage (if used)
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${GOOGLE_CLOUD_STORAGE_BUCKET:-}

      # Application Settings
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-52428800}

      # Security Settings
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      COOKIE_NAME: ${COOKIE_NAME:-auth-cookie}

      # Auth0 Configuration
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      JWKS_URL: ${JWKS_URL}
      API_AUDIENCE: ${API_AUDIENCE}

      # Email Configuration (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_DEBUG_LOGGING: ${ENABLE_DEBUG_LOGGING:-false}

      # Feature Flags
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-false}

    volumes:
      # Persistent storage for uploaded files
      - uploads:/app/uploads
      # Application logs
      - logs:/app/logs

    depends_on:
      db:
        condition: service_healthy

    networks:
      - ostsee-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    labels:
      - "com.ostsee-tiere.service=app"
      - "com.ostsee-tiere.version=${VERSION:-latest}"

  # ============================================
  # PostgreSQL with PostGIS
  # ============================================
  db:
    image: postgis/postgis:16-3.4
    container_name: ostsee-tiere-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-ostsee}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      # Performance tuning
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-256MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-16MB}

    volumes:
      # Persistent database storage
      - pgdata:/var/lib/postgresql/data
      # Backup directory
      - db-backups:/backups

    networks:
      - ostsee-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-ostsee}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    labels:
      - "com.ostsee-tiere.service=database"

  # ============================================
  # Prometheus (Monitoring)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ostsee-tiere-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ostsee-network
    labels:
      - "com.ostsee-tiere.service=monitoring"
    profiles:
      - monitoring

  # ============================================
  # Grafana (Visualization)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: ostsee-tiere-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - ostsee-network
    labels:
      - "com.ostsee-tiere.service=visualization"
    profiles:
      - monitoring

  # ============================================
  # Node Exporter (System Metrics)
  # ============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ostsee-tiere-node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - ostsee-network
    labels:
      - "com.ostsee-tiere.service=metrics"
    profiles:
      - monitoring

# ============================================
# Named Volumes
# ============================================
volumes:
  # Application uploads (images, files)
  uploads:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=uploads"

  # Application logs
  logs:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=logs"

  # PostgreSQL data
  pgdata:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=database"

  # Database backups
  db-backups:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=backups"

  # Prometheus metrics data
  prometheus-data:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=metrics"

  # Grafana dashboards and configuration
  grafana-data:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=dashboards"

# ============================================
# Networks
# ============================================
networks:
  ostsee-network:
    driver: bridge
    labels:
      - "com.ostsee-tiere.network=main"
