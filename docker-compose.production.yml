# ============================================
# Docker Compose Production Configuration
# ============================================
# Production-ready setup for Ostsee-Tiere platform
# Includes: Application, PostgreSQL with PostGIS, Prometheus, Grafana
#
# Quick Start:
#   1. Copy .env.docker to .env and configure
#   2. docker compose -f docker-compose.production.yml up -d
#   3. Initialize schema: docker exec ostsee-tiere-app npx drizzle-kit push
#   4. Access app at http://localhost:3000

services:
  # ============================================
  # Application Service
  # ============================================
  app:
    # Pin to specific version in production! Use :latest only for testing
    # Example: ghcr.io/jansinger/ostsee-sichtung:v2.1.0
    image: ghcr.io/jansinger/ostsee-sichtung:${IMAGE_TAG:-latest}
    container_name: ostsee-tiere-app
    restart: unless-stopped
    # SECURITY: Bind to localhost only if using reverse proxy
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-3000}:3000"
    environment:
      # Node.js Configuration
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # Database Connection (only DATABASE_POSTGRES_URL is used by the application)
      DATABASE_POSTGRES_URL: ${DATABASE_POSTGRES_URL}

      # Storage Configuration
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_PATH: /app/uploads

      # Vercel Blob Storage (if used)
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}

      # AWS S3 Storage (if used)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}

      # Google Cloud Storage (if used)
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${GOOGLE_CLOUD_STORAGE_BUCKET:-}

      # Application Settings
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-52428800}

      # Security Settings
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      COOKIE_NAME: ${COOKIE_NAME:-auth-cookie}

      # Auth0 Configuration
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      JWKS_URL: ${JWKS_URL}
      API_AUDIENCE: ${API_AUDIENCE}

      # Email Configuration (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_DEBUG_LOGGING: ${ENABLE_DEBUG_LOGGING:-false}

      # Feature Flags
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-false}

    volumes:
      # Persistent storage for uploaded files
      - uploads:/app/uploads
      # Application logs
      - logs:/app/logs

    depends_on:
      db:
        condition: service_healthy

    networks:
      - ostsee-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    labels:
      - "com.ostsee-tiere.service=app"
      - "com.ostsee-tiere.version=${VERSION:-latest}"

    # Security hardening
    security_opt:
      - no-new-privileges:true
    # Note: read_only:true would require tmpfs for /tmp - enable if needed
    # read_only: true
    # tmpfs:
    #   - /tmp

    # Logging configuration (prevent disk space issues)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Resource limits (adjust based on server capacity)
    # Note: Requires Docker Compose with --compatibility flag or Docker Swarm mode
    # For standard docker compose, these limits are advisory only
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-2}"
          memory: "${APP_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # ============================================
  # PostgreSQL with PostGIS
  # ============================================
  db:
    # PostgreSQL with PostGIS - override via POSTGRES_IMAGE_TAG if needed
    image: postgis/postgis:${POSTGRES_IMAGE_TAG:-18-3.6}
    container_name: ostsee-tiere-db
    restart: unless-stopped
    # SECURITY: Only expose to localhost, not publicly!
    # For external access, use SSH tunnel or reverse proxy
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      # Database initialization (must match DATABASE_POSTGRES_URL in app)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ostsee
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      # Performance tuning (optional overrides)
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-256MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-16MB}

    volumes:
      # Persistent database storage (aligned with development compose configuration)
      - pgdata:/var/lib/postgresql
      # Backup directory
      - db-backups:/backups

    networks:
      - ostsee-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ostsee"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    labels:
      - "com.ostsee-tiere.service=database"

    # Security hardening
    security_opt:
      - no-new-privileges:true

    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Prometheus (Monitoring)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ostsee-tiere-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ostsee-network
    labels:
      - "com.ostsee-tiere.service=monitoring"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    profiles:
      - monitoring

  # ============================================
  # Grafana (Visualization)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: ostsee-tiere-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - ostsee-network
    labels:
      - "com.ostsee-tiere.service=visualization"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    profiles:
      - monitoring

  # ============================================
  # Node Exporter (System Metrics)
  # ============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ostsee-tiere-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - ostsee-network
    labels:
      - "com.ostsee-tiere.service=metrics"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    profiles:
      - monitoring

# ============================================
# Named Volumes
# ============================================
volumes:
  # Application uploads (images, files)
  uploads:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=uploads"

  # Application logs
  logs:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=logs"

  # PostgreSQL data
  pgdata:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=database"

  # Database backups
  db-backups:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=backups"

  # Prometheus metrics data
  prometheus-data:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=metrics"

  # Grafana dashboards and configuration
  grafana-data:
    driver: local
    labels:
      - "com.ostsee-tiere.volume=dashboards"

# ============================================
# Networks
# ============================================
networks:
  ostsee-network:
    driver: bridge
    labels:
      - "com.ostsee-tiere.network=main"
